<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 424" role="img" aria-label="Governance helps people find data, trust it and protect it" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Governance helps people find data, trust it and protect it</text><g><rect x="24" y="48" width="344" height="124" rx="8" fill="#2b2a27" stroke="#76746d" stroke-width="1.25"></rect><text x="40" y="70" font-weight="600" fill="#ecebe7">Find it</text><rect x="40" y="80" width="150" height="76" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="202" y="80" width="150" height="76" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><text x="50" y="100" font-weight="600" fill="#ecebe7">Data catalog</text><text x="50" y="118" font-size="11.5" fill="#a9a7a0">A searchable list</text><text x="50" y="134" font-size="11.5" fill="#a9a7a0">of your data</text><text x="212" y="100" font-weight="600" fill="#ecebe7">Metadata</text><text x="212" y="118" font-size="11.5" fill="#a9a7a0">Data about data, such</text><text x="212" y="134" font-size="11.5" fill="#a9a7a0">as column names</text></g><g><rect x="392" y="48" width="344" height="124" rx="8" fill="#2b2a27" stroke="#76746d" stroke-width="1.25"></rect><text x="408" y="70" font-weight="600" fill="#ecebe7">Trust it</text><rect x="408" y="80" width="150" height="76" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="570" y="80" width="150" height="76" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><text x="418" y="100" font-weight="600" fill="#ecebe7">Lineage</text><text x="418" y="118" font-size="11.5" fill="#a9a7a0">Where data came from</text><text x="418" y="134" font-size="11.5" fill="#a9a7a0">and where it goes</text><text x="580" y="100" font-weight="600" fill="#ecebe7">Data ownership</text><text x="580" y="118" font-size="11.5" fill="#a9a7a0">A named team for</text><text x="580" y="134" font-size="11.5" fill="#a9a7a0">each dataset</text></g><g><rect x="24" y="188" width="712" height="212" rx="8" fill="#2b2a27" stroke="#76746d" stroke-width="1.25"></rect><text x="40" y="210" font-weight="600" fill="#ecebe7">Protect it</text><rect x="40" y="220" width="161" height="76" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="213" y="220" width="161" height="76" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="386" y="220" width="161" height="76" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="559" y="220" width="161" height="76" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="40" y="308" width="161" height="76" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="213" y="308" width="161" height="76" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="386" y="308" width="161" height="76" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="559" y="308" width="161" height="76" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="50" y="240" font-weight="600" fill="#ecebe7">Classification</text><text x="50" y="258" font-size="11.5" fill="#ecebe7">Labels: public, internal</text><text x="50" y="274" font-size="11.5" fill="#ecebe7">or confidential</text><text x="223" y="240" font-weight="600" fill="#ecebe7">RBAC</text><text x="223" y="258" font-size="11.5" fill="#ecebe7">Role-based access:</text><text x="223" y="274" font-size="11.5" fill="#ecebe7">analysts read Gold</text><text x="396" y="240" font-weight="600" fill="#ecebe7">ABAC</text><text x="396" y="258" font-size="11.5" fill="#ecebe7">Attribute-based access:</text><text x="396" y="274" font-size="11.5" fill="#ecebe7">EU staff see EU rows</text><text x="569" y="240" font-weight="600" fill="#ecebe7">Least privilege</text><text x="569" y="258" font-size="11.5" fill="#ecebe7">Only the access</text><text x="569" y="274" font-size="11.5" fill="#ecebe7">someone needs</text><text x="50" y="328" font-weight="600" fill="#ecebe7">Encryption</text><text x="50" y="346" font-size="11.5" fill="#ecebe7">Scrambled at rest</text><text x="50" y="362" font-size="11.5" fill="#ecebe7">and in transit</text><text x="223" y="328" font-weight="600" fill="#ecebe7">PII</text><text x="223" y="346" font-size="11.5" fill="#ecebe7">Personally identifiable</text><text x="223" y="362" font-size="11.5" fill="#ecebe7">information, like email</text><text x="396" y="328" font-weight="600" fill="#ecebe7">Retention</text><text x="396" y="346" font-size="11.5" fill="#ecebe7">How long data is kept,</text><text x="396" y="362" font-size="11.5" fill="#ecebe7">then deleted</text><text x="569" y="328" font-weight="600" fill="#ecebe7">Audit log</text><text x="569" y="346" font-size="11.5" fill="#ecebe7">Who did what,</text><text x="569" y="362" font-size="11.5" fill="#ecebe7">and when</text></g></svg>
