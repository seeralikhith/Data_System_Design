<svg xmlns="http://www.w3.org/2000/svg" width="760" height="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 224" role="img" aria-label="Data skew: one overloaded task makes the whole job wait" font-size="13"><defs><marker id="skew-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" fill="#1f1e1d">Data skew: one overloaded task makes the whole job wait</text><text x="24" y="44" font-size="11.5" fill="#5e5d59">Each bar shows how long a task runs. Lengths are illustrative</text><g><rect x="90" y="60" width="120" height="22" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="90" y="92" width="140" height="22" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="90" y="124" width="110" height="22" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="90" y="156" width="540" height="22" rx="4" fill="#d13b3b" fill-opacity="0.12" stroke="#d13b3b" stroke-width="2"></rect><text x="24" y="75" fill="#1f1e1d">Task 1</text><text x="24" y="107" fill="#1f1e1d">Task 2</text><text x="24" y="139" fill="#1f1e1d">Task 3</text><text x="24" y="171" font-weight="600" fill="#1f1e1d">Task 4</text><text x="244" y="107" font-size="11.5" fill="#5e5d59">Finished early, then idle</text><text x="104" y="171" font-size="11.5" font-weight="600" fill="#1f1e1d">A hot key: far more rows than the other tasks</text></g><g><path d="M630 52V190" fill="none" stroke="#a9a79f" stroke-width="1.25" stroke-dasharray="4 4"></path><text x="638" y="75" font-size="11.5" fill="#1f1e1d">Job finishes</text></g><g><path d="M90 200H700" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#skew-arrow)"></path><text x="706" y="204" font-size="11.5" fill="#5e5d59">Time</text></g></svg>
