<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 352" role="img" aria-label="Choosing a join strategy starts with table size" font-size="11.5"><defs><marker id="join-pick-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Choosing a join strategy starts with table size</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M246 92H300" marker-end="url(#join-pick-arrow)"></path><path d="M150 132V164" marker-end="url(#join-pick-arrow)"></path><path d="M246 204H300" marker-end="url(#join-pick-arrow)"></path><path d="M150 244V280" marker-end="url(#join-pick-arrow)"></path></g><g><polygon points="54,92 150,52 246,92 150,132" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></polygon><text x="150" y="88" text-anchor="middle" font-weight="600" fill="#1f1e1d">Is one table</text><text x="150" y="104" text-anchor="middle" font-weight="600" fill="#1f1e1d">small enough to copy?</text></g><g><polygon points="54,204 150,164 246,204 150,244" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></polygon><text x="150" y="200" text-anchor="middle" font-weight="600" fill="#1f1e1d">Are both tables</text><text x="150" y="216" text-anchor="middle" font-weight="600" fill="#1f1e1d">very large?</text></g><g><rect x="300" y="68" width="280" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="316" y="88" font-size="13" font-weight="600" fill="#1f1e1d">Broadcast hash join</text><text x="316" y="106" fill="#5e5d59">Copy the small table to every worker</text></g><g><rect x="300" y="180" width="280" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="316" y="200" font-size="13" font-weight="600" fill="#1f1e1d">Sort-merge join</text><text x="316" y="218" fill="#5e5d59">Shuffle and sort both sides, then merge</text></g><g><rect x="40" y="280" width="280" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="56" y="300" font-size="13" font-weight="600" fill="#1f1e1d">Shuffle hash join</text><text x="56" y="318" fill="#5e5d59">Shuffle both sides, then hash one of them</text></g><text x="273" y="84" text-anchor="middle" fill="#5e5d59">yes</text><text x="160" y="152" fill="#5e5d59">no</text><text x="273" y="196" text-anchor="middle" fill="#5e5d59">yes</text><text x="160" y="266" fill="#5e5d59">no</text></svg>
