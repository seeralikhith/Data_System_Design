<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 236" role="img" aria-label="One reusable pipeline, driven by a config file, builds many tables" font-size="11.5"><defs><marker id="cfg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#76746d"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">One reusable pipeline, driven by a config file, builds many tables</text><g><rect x="24" y="52" width="236" height="136" rx="8" fill="#2b2a27" stroke="#76746d" stroke-width="1.25"></rect><text x="40" y="76" font-size="13" font-weight="600" fill="#ecebe7">Config file</text><text x="40" y="104" fill="#ecebe7">orders: key order_id</text><text x="40" y="128" fill="#ecebe7">customers: key customer_id</text><text x="40" y="152" fill="#ecebe7">products: key product_id</text><text x="40" y="176" fill="#a9a7a0">A new table is one new line</text></g><g><rect x="300" y="96" width="196" height="48" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="2"></rect><text x="398" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#ecebe7">Reusable pipeline</text><text x="398" y="134" text-anchor="middle" fill="#ecebe7">Modular, tested code</text></g><g fill="none" stroke="#76746d" stroke-width="1.25"><path d="M260 120H300" marker-end="url(#cfg-arrow)"></path><path d="M496 120H516V74H536" marker-end="url(#cfg-arrow)"></path><path d="M516 120H536" marker-end="url(#cfg-arrow)"></path><path d="M516 120V166H536" marker-end="url(#cfg-arrow)"></path></g><g><rect x="536" y="56" width="200" height="36" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="536" y="102" width="200" height="36" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="536" y="148" width="200" height="36" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="548" y="78" fill="#ecebe7">silver.orders</text><text x="548" y="124" fill="#ecebe7">silver.customers</text><text x="548" y="170" fill="#ecebe7">silver.products</text></g><text x="24" y="216" fill="#a9a7a0">Every row also gets audit columns: _ingested_at, _source_file, _run_id and _updated_at</text></svg>
