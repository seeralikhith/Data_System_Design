<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 324" role="img" aria-label="The retail example in LLD: the tables in each layer and the rules around them" font-size="11.5"><defs><marker id="lld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">The retail example in LLD: the tables in each layer and the rules around them</text><g><rect x="24" y="48" width="224" height="172" rx="8" fill="#eeede8" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Bronze</text><rect x="36" y="82" width="200" height="44" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="48" y="100" font-weight="600" fill="#1f1e1d">orders_raw</text><text x="48" y="116" fill="#5e5d59">Append-only, audit columns</text></g><g><rect x="268" y="48" width="224" height="172" rx="8" fill="#eeede8" stroke="#a9a79f" stroke-width="1.25"></rect><text x="284" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Silver</text><rect x="280" y="82" width="200" height="44" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="292" y="100" font-weight="600" fill="#1f1e1d">orders</text><text x="292" y="116" fill="#5e5d59">Deduplicated, MERGE on order_id</text></g><g><rect x="512" y="48" width="224" height="172" rx="8" fill="#eeede8" stroke="#a9a79f" stroke-width="1.25"></rect><text x="528" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Gold</text><rect x="524" y="82" width="200" height="44" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="536" y="100" font-weight="600" fill="#1f1e1d">fct_order_line</text><text x="536" y="116" fill="#1f1e1d">One row per order line</text><rect x="524" y="134" width="200" height="62" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="536" y="152" font-weight="600" fill="#1f1e1d">dim_customer (SCD Type 2)</text><text x="536" y="168" fill="#5e5d59">plus dim_product, dim_date,</text><text x="536" y="184" fill="#5e5d59">dim_store</text></g><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M248 104H268" marker-end="url(#lld-arrow)"></path><path d="M492 104H512" marker-end="url(#lld-arrow)"></path></g><g><rect x="24" y="236" width="166" height="64" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="206" y="236" width="166" height="64" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="388" y="236" width="166" height="64" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="570" y="236" width="166" height="64" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="36" y="258" font-size="13" font-weight="600" fill="#1f1e1d">Layout</text><text x="36" y="276" fill="#5e5d59">Clustered by date and</text><text x="36" y="292" fill="#5e5d59">store, compacted weekly</text><text x="218" y="258" font-size="13" font-weight="600" fill="#1f1e1d">Quality</text><text x="218" y="276" fill="#5e5d59">Unique order_id,</text><text x="218" y="292" fill="#5e5d59">totals reconcile</text><text x="400" y="258" font-size="13" font-weight="600" fill="#1f1e1d">Publishing</text><text x="400" y="276" fill="#5e5d59">Write-Audit-Publish</text><text x="582" y="258" font-size="13" font-weight="600" fill="#1f1e1d">Security</text><text x="582" y="276" fill="#5e5d59">Email masked, BI uses</text><text x="582" y="292" fill="#5e5d59">a service principal</text></g></svg>
