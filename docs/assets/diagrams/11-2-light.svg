<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 228" role="img" aria-label="Reliability terms at a glance" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Reliability terms at a glance</text><g><rect x="24" y="48" width="166" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="206" y="48" width="166" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="388" y="48" width="166" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="570" y="48" width="166" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="24" y="132" width="166" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="206" y="132" width="166" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="388" y="132" width="166" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="570" y="132" width="166" height="72" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Fault tolerance</text><text x="36" y="88" fill="#5e5d59">Keeps working, or</text><text x="36" y="104" fill="#5e5d59">recovers, when a part fails</text><text x="218" y="70" font-size="13" font-weight="600" fill="#1f1e1d">SPOF</text><text x="218" y="88" fill="#5e5d59">Single point of failure:</text><text x="218" y="104" fill="#5e5d59">one part that stops all</text><text x="400" y="70" font-size="13" font-weight="600" fill="#1f1e1d">High availability</text><text x="400" y="88" fill="#5e5d59">Spare capacity, so there</text><text x="400" y="104" fill="#5e5d59">is very little downtime</text><text x="582" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Replication</text><text x="582" y="88" fill="#5e5d59">Copies of data kept in</text><text x="582" y="104" fill="#5e5d59">more than one place</text><text x="36" y="154" font-size="13" font-weight="600" fill="#1f1e1d">Disaster recovery</text><text x="36" y="172" fill="#5e5d59">The plan for restoring</text><text x="36" y="188" fill="#5e5d59">after a major outage</text><text x="218" y="154" font-size="13" font-weight="600" fill="#1f1e1d">Replay</text><text x="218" y="172" fill="#5e5d59">Reprocessing stored</text><text x="218" y="188" fill="#5e5d59">raw data</text><text x="400" y="154" font-size="13" font-weight="600" fill="#1f1e1d">Backfill</text><text x="400" y="172" fill="#5e5d59">Running a pipeline</text><text x="400" y="188" fill="#5e5d59">for a past period</text><text x="582" y="154" font-size="13" font-weight="600" fill="#1f1e1d">RPO and RTO</text><text x="582" y="172" fill="#1f1e1d">Data you can lose, and</text><text x="582" y="188" fill="#1f1e1d">time you can be down</text></g></svg>
