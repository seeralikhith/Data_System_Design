<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 328" role="img" aria-label="Retries wait longer each time, and messages that keep failing go to a dead-letter queue" font-size="11.5"><defs><marker id="dlq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Retries wait longer each time, and messages that keep failing are set aside</text><g><rect x="24" y="48" width="404" height="176" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Exponential backoff</text><text x="40" y="88" fill="#5e5d59">Wait longer after each failure, plus a little random jitter</text><path d="M64 136H88M104 136H168M184 136H328" fill="none" stroke="#a9a79f" stroke-width="1.25"></path><circle cx="56" cy="136" r="8" fill="#d13b3b"></circle><circle cx="96" cy="136" r="8" fill="#d13b3b"></circle><circle cx="176" cy="136" r="8" fill="#d13b3b"></circle><circle cx="336" cy="136" r="8" fill="#1e9e3a"></circle><text x="76" y="118" text-anchor="middle" fill="#5e5d59">wait 1s</text><text x="136" y="118" text-anchor="middle" fill="#5e5d59">wait 2s</text><text x="256" y="118" text-anchor="middle" fill="#5e5d59">wait 4s</text><text x="56" y="164" text-anchor="middle" fill="#1f1e1d">Try 1</text><text x="96" y="164" text-anchor="middle" fill="#1f1e1d">Try 2</text><text x="176" y="164" text-anchor="middle" fill="#1f1e1d">Try 3</text><text x="336" y="164" text-anchor="middle" font-weight="600" fill="#1f1e1d">Try 4 works</text><text x="40" y="204" fill="#5e5d59">Always set a maximum number of retries</text></g><g><rect x="452" y="48" width="284" height="176" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="468" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Dead-letter queue (DLQ)</text><rect x="468" y="84" width="120" height="30" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="468" y="132" width="120" height="30" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="612" y="132" width="108" height="30" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="468" y="182" width="120" height="30" rx="6" fill="#d13b3b" fill-opacity="0.12" stroke="#d13b3b" stroke-width="1.25"></rect><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M528 114V132" marker-end="url(#dlq-arrow)"></path><path d="M588 147H612" marker-end="url(#dlq-arrow)"></path><path d="M528 162V182" marker-end="url(#dlq-arrow)"></path></g><text x="528" y="103" text-anchor="middle" fill="#1f1e1d">Messages</text><text x="528" y="151" text-anchor="middle" fill="#1f1e1d">Processor</text><text x="666" y="151" text-anchor="middle" fill="#1f1e1d">Output</text><text x="528" y="201" text-anchor="middle" font-weight="600" fill="#1f1e1d">DLQ</text><text x="600" y="201" fill="#5e5d59">poison messages</text></g><g><rect x="24" y="240" width="166" height="64" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="206" y="240" width="166" height="64" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="388" y="240" width="166" height="64" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="570" y="240" width="166" height="64" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="36" y="264" font-size="13" font-weight="600" fill="#1f1e1d">Timeout</text><text x="36" y="282" fill="#5e5d59">Stops a stuck task</text><text x="218" y="264" font-size="13" font-weight="600" fill="#1f1e1d">Checkpoint restart</text><text x="218" y="282" fill="#5e5d59">Resume from last save</text><text x="400" y="264" font-size="13" font-weight="600" fill="#1f1e1d">Runbook</text><text x="400" y="282" fill="#5e5d59">Fix steps for a failure</text><text x="582" y="264" font-size="13" font-weight="600" fill="#1f1e1d">Postmortem</text><text x="582" y="282" fill="#5e5d59">A blameless review</text></g></svg>
