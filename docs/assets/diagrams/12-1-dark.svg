<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 240" role="img" aria-label="Scale up with a bigger machine, or scale out with more machines" font-size="13"><defs><marker id="scale-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#76746d"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Scale up with a bigger machine, or scale out with more machines</text><g><rect x="24" y="48" width="344" height="168" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="72" y="130" width="40" height="40" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M120 150H208" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#scale-arrow)"></path><rect x="216" y="104" width="92" height="92" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="2"></rect><text x="196" y="72" text-anchor="middle" font-weight="600" fill="#ecebe7">Vertical scaling (scale up)</text><text x="196" y="90" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Simple, but one machine has a limit</text></g><g><rect x="392" y="48" width="344" height="168" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="432" y="130" width="40" height="40" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M480 150H548" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#scale-arrow)"></path><rect x="556" y="106" width="40" height="40" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="612" y="106" width="40" height="40" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="668" y="106" width="40" height="40" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="556" y="154" width="40" height="40" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="612" y="154" width="40" height="40" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="668" y="154" width="40" height="40" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="564" y="72" text-anchor="middle" font-weight="600" fill="#ecebe7">Horizontal scaling (scale out)</text><text x="564" y="90" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Keeps growing, but work must be split up</text></g></svg>
