<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 368" role="img" aria-label="The same table looks different depending on who is asking" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">The same table looks different depending on who is asking</text><g><rect x="24" y="48" width="344" height="196" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="196" y="70" text-anchor="middle" font-weight="600" fill="#1f1e1d">Admin view</text><text x="196" y="88" text-anchor="middle" font-size="11.5" fill="#5e5d59">Sees every row and every value</text><g><rect x="40" y="100" width="312" height="24" fill="#eeede8"></rect><rect x="40" y="100" width="312" height="96" fill="none" stroke="#a9a79f" stroke-width="1"></rect><line x1="40" x2="352" y1="124" y2="124" stroke="#e3e1da"></line><line x1="40" x2="352" y1="148" y2="148" stroke="#e3e1da"></line><line x1="40" x2="352" y1="172" y2="172" stroke="#e3e1da"></line></g><text x="48" y="116" font-size="11.5" font-weight="600" fill="#1f1e1d">Region</text><text x="108" y="116" font-size="11.5" font-weight="600" fill="#1f1e1d">Email</text><text x="258" y="116" font-size="11.5" font-weight="600" fill="#1f1e1d">Card</text><text x="48" y="140" font-size="11.5" fill="#1f1e1d">EU</text><text x="108" y="140" font-size="11.5" fill="#1f1e1d">asha@example.com</text><text x="258" y="140" font-size="11.5" fill="#1f1e1d">1234 5678</text><text x="48" y="164" font-size="11.5" fill="#1f1e1d">US</text><text x="108" y="164" font-size="11.5" fill="#1f1e1d">ben@example.com</text><text x="258" y="164" font-size="11.5" fill="#1f1e1d">8765 4321</text><text x="48" y="188" font-size="11.5" fill="#1f1e1d">EU</text><text x="108" y="188" font-size="11.5" fill="#1f1e1d">chen@example.com</text><text x="258" y="188" font-size="11.5" fill="#1f1e1d">5678 1234</text><text x="196" y="222" text-anchor="middle" font-size="11.5" fill="#5e5d59">Made-up example data</text></g><g><rect x="392" y="48" width="344" height="196" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="564" y="70" text-anchor="middle" font-weight="600" fill="#1f1e1d">EU analyst view</text><text x="564" y="88" text-anchor="middle" font-size="11.5" fill="#5e5d59">Sees less, because the controls apply</text><g><rect x="408" y="100" width="312" height="24" fill="#eeede8"></rect><rect x="408" y="100" width="312" height="96" fill="none" stroke="#a9a79f" stroke-width="1"></rect><line x1="408" x2="720" y1="124" y2="124" stroke="#e3e1da"></line><line x1="408" x2="720" y1="148" y2="148" stroke="#e3e1da"></line><line x1="408" x2="720" y1="172" y2="172" stroke="#e3e1da"></line></g><rect x="408" y="148" width="312" height="24" fill="#d13b3b" fill-opacity="0.12"></rect><rect x="468" y="124" width="150" height="24" fill="#2a6fd6" fill-opacity="0.14"></rect><rect x="468" y="172" width="150" height="24" fill="#2a6fd6" fill-opacity="0.14"></rect><rect x="618" y="124" width="102" height="24" fill="#2a6fd6" fill-opacity="0.28"></rect><rect x="618" y="172" width="102" height="24" fill="#2a6fd6" fill-opacity="0.28"></rect><text x="416" y="116" font-size="11.5" font-weight="600" fill="#1f1e1d">Region</text><text x="476" y="116" font-size="11.5" font-weight="600" fill="#1f1e1d">Email</text><text x="626" y="116" font-size="11.5" font-weight="600" fill="#1f1e1d">Card</text><text x="416" y="140" font-size="11.5" fill="#1f1e1d">EU</text><text x="476" y="140" font-size="11.5" fill="#1f1e1d">****@example.com</text><text x="626" y="140" font-size="11.5" fill="#1f1e1d">tok_81f2</text><text x="564" y="164" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Row filter hides the US row</text><text x="416" y="188" font-size="11.5" fill="#1f1e1d">EU</text><text x="476" y="188" font-size="11.5" fill="#1f1e1d">****@example.com</text><text x="626" y="188" font-size="11.5" fill="#1f1e1d">tok_2c9d</text><text x="543" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Column mask</text><text x="669" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Tokenization</text></g><g><rect x="24" y="272" width="166" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="206" y="272" width="166" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="388" y="272" width="166" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="570" y="272" width="166" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="36" y="294" font-weight="600" fill="#1f1e1d">Hashing</text><text x="36" y="312" font-size="11.5" fill="#5e5d59">A one-way code, best</text><text x="36" y="328" font-size="11.5" fill="#5e5d59">with a secret salt</text><text x="218" y="294" font-weight="600" fill="#1f1e1d">Secrets management</text><text x="218" y="312" font-size="11.5" fill="#5e5d59">Passwords in a vault,</text><text x="218" y="328" font-size="11.5" fill="#5e5d59">never in code</text><text x="400" y="294" font-weight="600" fill="#1f1e1d">Service principal</text><text x="400" y="312" font-size="11.5" fill="#5e5d59">A non-human login</text><text x="400" y="328" font-size="11.5" fill="#5e5d59">for a job or tool</text><text x="582" y="294" font-weight="600" fill="#1f1e1d">Audit logs</text><text x="582" y="312" font-size="11.5" fill="#5e5d59">Record who accessed</text><text x="582" y="328" font-size="11.5" fill="#5e5d59">what, and when</text></g></svg>
