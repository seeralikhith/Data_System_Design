<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 236" role="img" aria-label="Some measures add up, some add up only partly, and some never do" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Some measures add up, some add up only partly, and some never do</text><g><rect x="24" y="48" width="224" height="164" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#ecebe7">Additive</text><text x="36" y="88" fill="#a9a7a0">Add across everything</text><text x="36" y="114" fill="#ecebe7">Revenue Monday: 10</text><text x="36" y="132" fill="#ecebe7">Revenue Tuesday: 20</text><circle cx="40" cy="154" r="4" fill="#4cc566"></circle><text x="50" y="158" font-weight="600" fill="#ecebe7">Total 30 is right</text></g><g><rect x="268" y="48" width="224" height="164" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="280" y="70" font-size="13" font-weight="600" fill="#ecebe7">Semi-additive</text><text x="280" y="88" fill="#a9a7a0">Add across stores, not across days</text><text x="280" y="114" fill="#ecebe7">Stock on Monday: 100</text><text x="280" y="132" fill="#ecebe7">Stock on Tuesday: 90</text><circle cx="284" cy="154" r="4" fill="#f06a6a"></circle><text x="294" y="158" font-weight="600" fill="#ecebe7">Total 190 is wrong</text><text x="280" y="184" fill="#a9a7a0">Use the latest value: 90</text></g><g><rect x="512" y="48" width="224" height="164" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="524" y="70" font-size="13" font-weight="600" fill="#ecebe7">Non-additive</text><text x="524" y="88" fill="#a9a7a0">Never add or average</text><text x="524" y="114" fill="#ecebe7">Store A: 1 of 2 = 50%</text><text x="524" y="132" fill="#ecebe7">Store B: 99 of 100 = 99%</text><circle cx="528" cy="154" r="4" fill="#f06a6a"></circle><text x="538" y="158" font-weight="600" fill="#ecebe7">Average 74.5% is wrong</text><circle cx="528" cy="180" r="4" fill="#4cc566"></circle><text x="538" y="184" font-weight="600" fill="#ecebe7">100 of 102 = 98% is right</text></g></svg>
