<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 368" role="img" aria-label="The same table looks different depending on who is asking" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">The same table looks different depending on who is asking</text><g><rect x="24" y="48" width="344" height="196" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="196" y="70" text-anchor="middle" font-weight="600" fill="#ecebe7">Admin view</text><text x="196" y="88" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Sees every row and every value</text><g><rect x="40" y="100" width="312" height="24" fill="#2b2a27"></rect><rect x="40" y="100" width="312" height="96" fill="none" stroke="#76746d" stroke-width="1"></rect><line x1="40" x2="352" y1="124" y2="124" stroke="#3a3936"></line><line x1="40" x2="352" y1="148" y2="148" stroke="#3a3936"></line><line x1="40" x2="352" y1="172" y2="172" stroke="#3a3936"></line></g><text x="48" y="116" font-size="11.5" font-weight="600" fill="#ecebe7">Region</text><text x="108" y="116" font-size="11.5" font-weight="600" fill="#ecebe7">Email</text><text x="258" y="116" font-size="11.5" font-weight="600" fill="#ecebe7">Card</text><text x="48" y="140" font-size="11.5" fill="#ecebe7">EU</text><text x="108" y="140" font-size="11.5" fill="#ecebe7">asha@example.com</text><text x="258" y="140" font-size="11.5" fill="#ecebe7">1234 5678</text><text x="48" y="164" font-size="11.5" fill="#ecebe7">US</text><text x="108" y="164" font-size="11.5" fill="#ecebe7">ben@example.com</text><text x="258" y="164" font-size="11.5" fill="#ecebe7">8765 4321</text><text x="48" y="188" font-size="11.5" fill="#ecebe7">EU</text><text x="108" y="188" font-size="11.5" fill="#ecebe7">chen@example.com</text><text x="258" y="188" font-size="11.5" fill="#ecebe7">5678 1234</text><text x="196" y="222" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Made-up example data</text></g><g><rect x="392" y="48" width="344" height="196" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="564" y="70" text-anchor="middle" font-weight="600" fill="#ecebe7">EU analyst view</text><text x="564" y="88" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Sees less, because the controls apply</text><g><rect x="408" y="100" width="312" height="24" fill="#2b2a27"></rect><rect x="408" y="100" width="312" height="96" fill="none" stroke="#76746d" stroke-width="1"></rect><line x1="408" x2="720" y1="124" y2="124" stroke="#3a3936"></line><line x1="408" x2="720" y1="148" y2="148" stroke="#3a3936"></line><line x1="408" x2="720" y1="172" y2="172" stroke="#3a3936"></line></g><rect x="408" y="148" width="312" height="24" fill="#f06a6a" fill-opacity="0.12"></rect><rect x="468" y="124" width="150" height="24" fill="#5b9bf2" fill-opacity="0.14"></rect><rect x="468" y="172" width="150" height="24" fill="#5b9bf2" fill-opacity="0.14"></rect><rect x="618" y="124" width="102" height="24" fill="#5b9bf2" fill-opacity="0.28"></rect><rect x="618" y="172" width="102" height="24" fill="#5b9bf2" fill-opacity="0.28"></rect><text x="416" y="116" font-size="11.5" font-weight="600" fill="#ecebe7">Region</text><text x="476" y="116" font-size="11.5" font-weight="600" fill="#ecebe7">Email</text><text x="626" y="116" font-size="11.5" font-weight="600" fill="#ecebe7">Card</text><text x="416" y="140" font-size="11.5" fill="#ecebe7">EU</text><text x="476" y="140" font-size="11.5" fill="#ecebe7">****@example.com</text><text x="626" y="140" font-size="11.5" fill="#ecebe7">tok_81f2</text><text x="564" y="164" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ecebe7">Row filter hides the US row</text><text x="416" y="188" font-size="11.5" fill="#ecebe7">EU</text><text x="476" y="188" font-size="11.5" fill="#ecebe7">****@example.com</text><text x="626" y="188" font-size="11.5" fill="#ecebe7">tok_2c9d</text><text x="543" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ecebe7">Column mask</text><text x="669" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ecebe7">Tokenization</text></g><g><rect x="24" y="272" width="166" height="72" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="206" y="272" width="166" height="72" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="388" y="272" width="166" height="72" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="570" y="272" width="166" height="72" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><text x="36" y="294" font-weight="600" fill="#ecebe7">Hashing</text><text x="36" y="312" font-size="11.5" fill="#a9a7a0">A one-way code, best</text><text x="36" y="328" font-size="11.5" fill="#a9a7a0">with a secret salt</text><text x="218" y="294" font-weight="600" fill="#ecebe7">Secrets management</text><text x="218" y="312" font-size="11.5" fill="#a9a7a0">Passwords in a vault,</text><text x="218" y="328" font-size="11.5" fill="#a9a7a0">never in code</text><text x="400" y="294" font-weight="600" fill="#ecebe7">Service principal</text><text x="400" y="312" font-size="11.5" fill="#a9a7a0">A non-human login</text><text x="400" y="328" font-size="11.5" fill="#a9a7a0">for a job or tool</text><text x="582" y="294" font-weight="600" fill="#ecebe7">Audit logs</text><text x="582" y="312" font-size="11.5" fill="#a9a7a0">Record who accessed</text><text x="582" y="328" font-size="11.5" fill="#a9a7a0">what, and when</text></g></svg>
