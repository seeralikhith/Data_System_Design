<svg xmlns="http://www.w3.org/2000/svg" width="760" height="202" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 202" role="img" aria-label="When a customer moves city, each SCD type keeps different history" font-size="13"><text x="24" y="26" font-size="15" font-weight="600" fill="#ecebe7">When a customer moves city, each SCD type keeps different history</text><text x="24" y="44" font-size="11.5" fill="#a9a7a0">Customer C-17 moves from Pune to Bengaluru. Shaded rows hold the current value</text><g><rect x="24" y="58" width="224" height="120" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="36" y="82" font-weight="600" fill="#ecebe7">Type 1: overwrite</text><text x="36" y="100" font-size="11.5" fill="#a9a7a0">No history is kept</text><rect x="36" y="112" width="200" height="24" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="46" y="128" font-size="11.5" fill="#ecebe7">C-17, Bengaluru</text></g><g><rect x="268" y="58" width="224" height="120" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="280" y="82" font-weight="600" fill="#ecebe7">Type 2: add a row</text><text x="280" y="100" font-size="11.5" fill="#a9a7a0">Full history is kept</text><rect x="280" y="112" width="200" height="24" rx="4" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="280" y="142" width="200" height="24" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="290" y="128" font-size="11.5" fill="#ecebe7">C-17, Pune, until Mar 2026</text><text x="290" y="158" font-size="11.5" fill="#ecebe7">C-17, Bengaluru, current</text></g><g><rect x="512" y="58" width="224" height="120" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="524" y="82" font-weight="600" fill="#ecebe7">Type 3: add a column</text><text x="524" y="100" font-size="11.5" fill="#a9a7a0">Only the last change is kept</text><rect x="524" y="112" width="200" height="24" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="534" y="128" font-size="11.5" fill="#ecebe7">C-17, Bengaluru, was Pune</text></g></svg>
