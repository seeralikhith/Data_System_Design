<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 328" role="img" aria-label="Every need leads to an HLD choice, and every choice creates LLD work" font-size="11.5"><defs><marker id="need-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Every need leads to an HLD choice, and every choice creates LLD work</text><text x="24" y="62" font-size="13" font-weight="600" fill="#1f1e1d">The need</text><text x="272" y="62" font-size="13" font-weight="600" fill="#1f1e1d">HLD choice</text><text x="520" y="62" font-size="13" font-weight="600" fill="#1f1e1d">LLD work</text><g><g><rect x="24" y="72" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="272" y="72" width="216" height="52" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="520" y="72" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M240 98H272" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#need-arrow)"></path><path d="M488 98H520" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#need-arrow)"></path></g><g><rect x="24" y="132" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="272" y="132" width="216" height="52" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="520" y="132" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M240 158H272" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#need-arrow)"></path><path d="M488 158H520" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#need-arrow)"></path></g><g><rect x="24" y="192" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="272" y="192" width="216" height="52" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="520" y="192" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M240 218H272" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#need-arrow)"></path><path d="M488 218H520" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#need-arrow)"></path></g><g><rect x="24" y="252" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="272" y="252" width="216" height="52" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="520" y="252" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M240 278H272" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#need-arrow)"></path><path d="M488 278H520" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#need-arrow)"></path></g></g><text x="36" y="94" fill="#1f1e1d">Dashboard updates</text><text x="36" y="110" fill="#1f1e1d">every 5 minutes</text><text x="284" y="102" fill="#1f1e1d">Micro-batch or streaming</text><text x="532" y="94" fill="#1f1e1d">Watermarks, checkpoints,</text><text x="532" y="110" fill="#1f1e1d">MERGE</text><text x="36" y="154" fill="#1f1e1d">Raw data must</text><text x="36" y="170" fill="#1f1e1d">allow rebuilds</text><text x="284" y="162" fill="#1f1e1d">Medallion architecture</text><text x="532" y="154" fill="#1f1e1d">Append-only Bronze,</text><text x="532" y="170" fill="#1f1e1d">star schema in Gold</text><text x="36" y="214" fill="#1f1e1d">Reports must not show</text><text x="36" y="230" fill="#1f1e1d">wrong numbers</text><text x="284" y="214" fill="#1f1e1d">Quality gate before</text><text x="284" y="230" fill="#1f1e1d">publishing</text><text x="532" y="214" fill="#1f1e1d">Reconciliation,</text><text x="532" y="230" fill="#1f1e1d">Write-Audit-Publish</text><text x="36" y="274" fill="#1f1e1d">Personal data must</text><text x="36" y="290" fill="#1f1e1d">be protected</text><text x="284" y="282" fill="#1f1e1d">Central governance</text><text x="532" y="274" fill="#1f1e1d">Column masks,</text><text x="532" y="290" fill="#1f1e1d">deletion jobs</text></svg>
