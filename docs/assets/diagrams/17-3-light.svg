<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 280" role="img" aria-label="How a pipeline should respond when the source changes" font-size="11.5"><defs><marker id="evo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">How a pipeline should respond when the source changes</text><text x="24" y="62" font-size="13" font-weight="600" fill="#1f1e1d">Source change</text><text x="272" y="62" font-size="13" font-weight="600" fill="#1f1e1d">Usual response</text><g><g><rect x="24" y="72" width="216" height="40" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M240 92H272" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#evo-arrow)"></path></g><g><rect x="24" y="120" width="216" height="40" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M240 140H272" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#evo-arrow)"></path></g><g><rect x="24" y="168" width="216" height="40" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M240 188H272" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#evo-arrow)"></path></g><g><rect x="24" y="216" width="216" height="40" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M240 236H272" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#evo-arrow)"></path></g><rect x="272" y="72" width="464" height="40" rx="6" fill="#1e9e3a" fill-opacity="0.12" stroke="#1e9e3a" stroke-width="1.25"></rect><rect x="272" y="120" width="464" height="40" rx="6" fill="#1e9e3a" fill-opacity="0.12" stroke="#1e9e3a" stroke-width="1.25"></rect><rect x="272" y="168" width="464" height="40" rx="6" fill="#d13b3b" fill-opacity="0.12" stroke="#d13b3b" stroke-width="1.25"></rect><rect x="272" y="216" width="464" height="40" rx="6" fill="#d13b3b" fill-opacity="0.12" stroke="#d13b3b" stroke-width="1.25"></rect></g><text x="36" y="96" fill="#1f1e1d">New column</text><text x="284" y="96" fill="#1f1e1d">Add it automatically, or hold it for review</text><text x="36" y="144" fill="#1f1e1d">Column removed</text><text x="284" y="144" fill="#1f1e1d">Keep it as null, and alert the owner</text><text x="36" y="192" fill="#1f1e1d">Type changed</text><text x="284" y="192" fill="#1f1e1d">Stop or quarantine, then review, because data could be corrupted</text><text x="36" y="240" fill="#1f1e1d">Column renamed</text><text x="284" y="240" fill="#1f1e1d">Treat as a breaking change and agree it through the data contract</text></svg>
