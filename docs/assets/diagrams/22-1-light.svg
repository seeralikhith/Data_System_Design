<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 376" role="img" aria-label="First ask whether a failure is temporary" font-size="13"><defs><marker id="fail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">First ask whether a failure is temporary</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M134 96H156" marker-end="url(#fail-arrow)"></path><path d="M284 96H330" marker-end="url(#fail-arrow)"></path><path d="M220 136V172" marker-end="url(#fail-arrow)"></path><path d="M296 216H330" marker-end="url(#fail-arrow)"></path><path d="M220 260V296" marker-end="url(#fail-arrow)"></path></g><g><rect x="24" y="72" width="110" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="79" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">Task fails</text></g><g><polygon points="156,96 220,56 284,96 220,136" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></polygon><text x="220" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Temporary?</text></g><g><polygon points="144,216 220,172 296,216 220,260" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></polygon><text x="220" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Just one</text><text x="220" y="228" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">bad record?</text></g><g><rect x="330" y="68" width="280" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="346" y="92" font-weight="600" fill="#1f1e1d">Retry with exponential backoff</text><text x="346" y="108" font-size="11.5" fill="#5e5d59">Example: a brief network error</text></g><g><rect x="330" y="188" width="280" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="346" y="212" font-weight="600" fill="#1f1e1d">Quarantine it and carry on</text><text x="346" y="228" font-size="11.5" fill="#5e5d59">Example: one malformed row or poison message</text></g><g><rect x="114" y="296" width="212" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="220" y="320" text-anchor="middle" font-weight="600" fill="#1f1e1d">Stop, alert, fix, then backfill</text><text x="220" y="336" text-anchor="middle" font-size="11.5" fill="#5e5d59">Example: a bug in the logic</text></g><text x="306" y="88" text-anchor="middle" font-size="11.5" fill="#5e5d59">yes</text><text x="230" y="158" font-size="11.5" fill="#5e5d59">no</text><text x="313" y="208" text-anchor="middle" font-size="11.5" fill="#5e5d59">yes</text><text x="230" y="282" font-size="11.5" fill="#5e5d59">no</text></svg>
