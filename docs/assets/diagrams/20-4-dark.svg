<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 236" role="img" aria-label="Delivery guarantees describe how many times each event is processed" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Delivery guarantees describe how many times each event is processed</text><text x="220" y="54" fill="#a9a7a0">Times each event is processed</text><text x="440" y="54" fill="#a9a7a0">Risk</text><g><rect x="24" y="64" width="712" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="24" y="120" width="712" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="24" y="176" width="712" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1"></rect></g><g><text x="40" y="92" font-size="13" font-weight="600" fill="#ecebe7">At-most-once</text><circle cx="236" cy="88" r="8" fill="#5b9bf2"></circle><text x="262" y="92" text-anchor="middle" fill="#a9a7a0">or</text><circle cx="288" cy="88" r="8" fill="none" stroke="#76746d" stroke-width="1.25" stroke-dasharray="3 3"></circle><text x="310" y="92" fill="#ecebe7">1 or 0</text><circle cx="446" cy="88" r="4" fill="#f06a6a"></circle><text x="458" y="92" fill="#ecebe7">Data can be lost</text></g><g><text x="40" y="148" font-size="13" font-weight="600" fill="#ecebe7">At-least-once</text><circle cx="236" cy="144" r="8" fill="#5b9bf2"></circle><text x="262" y="148" text-anchor="middle" fill="#a9a7a0">or</text><circle cx="288" cy="144" r="8" fill="#5b9bf2"></circle><circle cx="308" cy="144" r="8" fill="#5b9bf2"></circle><text x="328" y="148" fill="#ecebe7">1 or more</text><circle cx="446" cy="144" r="4" fill="#f06a6a"></circle><text x="458" y="148" fill="#ecebe7">Duplicates, so writes must be idempotent</text></g><g><text x="40" y="204" font-size="13" font-weight="600" fill="#ecebe7">Exactly-once</text><circle cx="236" cy="200" r="8" fill="#5b9bf2"></circle><text x="256" y="204" fill="#ecebe7">Exactly 1</text><circle cx="446" cy="200" r="4" fill="#4cc566"></circle><text x="458" y="204" fill="#ecebe7">Needs source, engine and sink to cooperate</text></g></svg>
