<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 328" role="img" aria-label="Every need leads to an HLD choice, and every choice creates LLD work" font-size="11.5"><defs><marker id="need-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#76746d"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Every need leads to an HLD choice, and every choice creates LLD work</text><text x="24" y="62" font-size="13" font-weight="600" fill="#ecebe7">The need</text><text x="272" y="62" font-size="13" font-weight="600" fill="#ecebe7">HLD choice</text><text x="520" y="62" font-size="13" font-weight="600" fill="#ecebe7">LLD work</text><g><g><rect x="24" y="72" width="216" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="272" y="72" width="216" height="52" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="520" y="72" width="216" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M240 98H272" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#need-arrow)"></path><path d="M488 98H520" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#need-arrow)"></path></g><g><rect x="24" y="132" width="216" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="272" y="132" width="216" height="52" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="520" y="132" width="216" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M240 158H272" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#need-arrow)"></path><path d="M488 158H520" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#need-arrow)"></path></g><g><rect x="24" y="192" width="216" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="272" y="192" width="216" height="52" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="520" y="192" width="216" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M240 218H272" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#need-arrow)"></path><path d="M488 218H520" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#need-arrow)"></path></g><g><rect x="24" y="252" width="216" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="272" y="252" width="216" height="52" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="520" y="252" width="216" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M240 278H272" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#need-arrow)"></path><path d="M488 278H520" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#need-arrow)"></path></g></g><text x="36" y="94" fill="#ecebe7">Dashboard updates</text><text x="36" y="110" fill="#ecebe7">every 5 minutes</text><text x="284" y="102" fill="#ecebe7">Micro-batch or streaming</text><text x="532" y="94" fill="#ecebe7">Watermarks, checkpoints,</text><text x="532" y="110" fill="#ecebe7">MERGE</text><text x="36" y="154" fill="#ecebe7">Raw data must</text><text x="36" y="170" fill="#ecebe7">allow rebuilds</text><text x="284" y="162" fill="#ecebe7">Medallion architecture</text><text x="532" y="154" fill="#ecebe7">Append-only Bronze,</text><text x="532" y="170" fill="#ecebe7">star schema in Gold</text><text x="36" y="214" fill="#ecebe7">Reports must not show</text><text x="36" y="230" fill="#ecebe7">wrong numbers</text><text x="284" y="214" fill="#ecebe7">Quality gate before</text><text x="284" y="230" fill="#ecebe7">publishing</text><text x="532" y="214" fill="#ecebe7">Reconciliation,</text><text x="532" y="230" fill="#ecebe7">Write-Audit-Publish</text><text x="36" y="274" fill="#ecebe7">Personal data must</text><text x="36" y="290" fill="#ecebe7">be protected</text><text x="284" y="282" fill="#ecebe7">Central governance</text><text x="532" y="274" fill="#ecebe7">Column masks,</text><text x="532" y="290" fill="#ecebe7">deletion jobs</text></svg>
