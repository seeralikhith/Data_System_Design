<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 236" role="img" aria-label="One reusable pipeline, driven by a config file, builds many tables" font-size="11.5"><defs><marker id="cfg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">One reusable pipeline, driven by a config file, builds many tables</text><g><rect x="24" y="52" width="236" height="136" rx="8" fill="#eeede8" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="76" font-size="13" font-weight="600" fill="#1f1e1d">Config file</text><text x="40" y="104" fill="#1f1e1d">orders: key order_id</text><text x="40" y="128" fill="#1f1e1d">customers: key customer_id</text><text x="40" y="152" fill="#1f1e1d">products: key product_id</text><text x="40" y="176" fill="#5e5d59">A new table is one new line</text></g><g><rect x="300" y="96" width="196" height="48" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="398" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Reusable pipeline</text><text x="398" y="134" text-anchor="middle" fill="#1f1e1d">Modular, tested code</text></g><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M260 120H300" marker-end="url(#cfg-arrow)"></path><path d="M496 120H516V74H536" marker-end="url(#cfg-arrow)"></path><path d="M516 120H536" marker-end="url(#cfg-arrow)"></path><path d="M516 120V166H536" marker-end="url(#cfg-arrow)"></path></g><g><rect x="536" y="56" width="200" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="536" y="102" width="200" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="536" y="148" width="200" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="548" y="78" fill="#1f1e1d">silver.orders</text><text x="548" y="124" fill="#1f1e1d">silver.customers</text><text x="548" y="170" fill="#1f1e1d">silver.products</text></g><text x="24" y="216" fill="#5e5d59">Every row also gets audit columns: _ingested_at, _source_file, _run_id and _updated_at</text></svg>
