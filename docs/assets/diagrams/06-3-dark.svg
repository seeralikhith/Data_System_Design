<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 216" role="img" aria-label="An open table format adds three protections to plain files" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">An open table format adds three protections to plain files</text><g><rect x="24" y="48" width="224" height="144" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#ecebe7">ACID transactions</text><text x="36" y="88" fill="#a9a7a0">A write is all or nothing</text><rect x="36" y="100" width="200" height="32" rx="4" fill="none" stroke="#f06a6a" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="136" y="120" text-anchor="middle" fill="#ecebe7">Half-finished write: hidden</text><rect x="36" y="142" width="200" height="32" rx="4" fill="#4cc566" fill-opacity="0.12" stroke="#4cc566" stroke-width="1.25"></rect><text x="136" y="162" text-anchor="middle" fill="#ecebe7">Readers see complete data</text></g><g><rect x="268" y="48" width="224" height="144" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="280" y="70" font-size="13" font-weight="600" fill="#ecebe7">Schema enforcement</text><text x="280" y="88" fill="#a9a7a0">Data must match the structure</text><rect x="280" y="100" width="200" height="32" rx="4" fill="#4cc566" fill-opacity="0.12" stroke="#4cc566" stroke-width="1.25"></rect><text x="380" y="120" text-anchor="middle" fill="#ecebe7">quantity = 2: accepted</text><rect x="280" y="142" width="200" height="32" rx="4" fill="#f06a6a" fill-opacity="0.12" stroke="#f06a6a" stroke-width="1.25"></rect><text x="380" y="162" text-anchor="middle" fill="#ecebe7">quantity = two: rejected</text></g><g><rect x="512" y="48" width="224" height="144" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="524" y="70" font-size="13" font-weight="600" fill="#ecebe7">Time travel</text><text x="524" y="88" fill="#a9a7a0">Read or restore older versions</text><path d="M566 124H610M638 124H682" fill="none" stroke="#76746d" stroke-width="1.25"></path><circle cx="552" cy="124" r="14" fill="none" stroke="#76746d" stroke-width="1.25"></circle><circle cx="624" cy="124" r="14" fill="none" stroke="#76746d" stroke-width="1.25"></circle><circle cx="696" cy="124" r="14" fill="#5b9bf2" fill-opacity="0.2" stroke="#5b9bf2" stroke-width="2"></circle><text x="552" y="128" text-anchor="middle" fill="#ecebe7">v1</text><text x="624" y="128" text-anchor="middle" fill="#ecebe7">v2</text><text x="696" y="128" text-anchor="middle" font-weight="600" fill="#ecebe7">v3</text><text x="624" y="166" text-anchor="middle" fill="#ecebe7">Go back to v2 after a bad load</text></g></svg>
