<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 386" role="img" aria-label="Measure it, set a target, then make a promise" font-size="13"><defs><marker id="obs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Measure it, set a target, then make a promise</text><g><rect x="24" y="48" width="224" height="64" rx="8" fill="none" fill-opacity="1" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="268" y="48" width="224" height="64" rx="8" fill="none" fill-opacity="1" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="512" y="48" width="224" height="64" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M248 80H268" marker-end="url(#obs-arrow)"></path><path d="M492 80H512" marker-end="url(#obs-arrow)"></path></g><text x="36" y="74" font-weight="600" fill="#1f1e1d">SLI: what you measure</text><text x="36" y="92" font-size="11.5" fill="#5e5d59">When the sales table updated</text><text x="280" y="74" font-weight="600" fill="#1f1e1d">SLO: your internal target</text><text x="280" y="92" font-size="11.5" fill="#5e5d59">Updated by 07:00 on 99% of days</text><text x="524" y="74" font-weight="600" fill="#1f1e1d">SLA: your promise to users</text><text x="524" y="92" font-size="11.5" fill="#1f1e1d">Ready by 08:00 on business days</text></g><text x="24" y="142" font-weight="600" fill="#1f1e1d">Six things to monitor</text><g><rect x="24" y="154" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="268" y="154" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="512" y="154" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="24" y="218" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="268" y="218" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="512" y="218" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="36" y="176" font-weight="600" fill="#1f1e1d">Freshness</text><text x="36" y="194" font-size="11.5" fill="#5e5d59">Did data arrive on time?</text><text x="280" y="176" font-weight="600" fill="#1f1e1d">Volume</text><text x="280" y="194" font-size="11.5" fill="#5e5d59">Is the row count unusual?</text><text x="524" y="176" font-weight="600" fill="#1f1e1d">Schema</text><text x="524" y="194" font-size="11.5" fill="#5e5d59">Did a column change?</text><text x="36" y="240" font-weight="600" fill="#1f1e1d">Distribution</text><text x="36" y="258" font-size="11.5" fill="#5e5d59">Did values shift unusually?</text><text x="280" y="240" font-weight="600" fill="#1f1e1d">Pipeline health</text><text x="280" y="258" font-size="11.5" fill="#5e5d59">Did jobs succeed on time?</text><text x="524" y="240" font-weight="600" fill="#1f1e1d">Cost</text><text x="524" y="258" font-size="11.5" fill="#5e5d59">Did spending suddenly jump?</text></g><text x="24" y="298" font-weight="600" fill="#1f1e1d">Three signals that help you investigate</text><g><rect x="24" y="310" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="268" y="310" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="512" y="310" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="36" y="332" font-weight="600" fill="#1f1e1d">Logs</text><text x="36" y="350" font-size="11.5" fill="#5e5d59">A record of what happened</text><text x="280" y="332" font-weight="600" fill="#1f1e1d">Metrics</text><text x="280" y="350" font-size="11.5" fill="#5e5d59">Numbers tracked over time</text><text x="524" y="332" font-weight="600" fill="#1f1e1d">Traces</text><text x="524" y="350" font-size="11.5" fill="#5e5d59">One task followed across systems</text></g></svg>
