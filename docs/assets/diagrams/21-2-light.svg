<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 268" role="img" aria-label="Each layer checks different things and reacts differently to failure" font-size="13"><defs><marker id="layer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Each layer checks different things and reacts differently to failure</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M248 66H268" marker-end="url(#layer-arrow)"></path><path d="M492 66H512" marker-end="url(#layer-arrow)"></path></g><g><rect x="24" y="48" width="224" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="24" y="92" width="224" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="24" y="172" width="224" height="72" rx="6" fill="#d13b3b" fill-opacity="0.1" stroke="#d13b3b" stroke-width="1.25"></rect><text x="136" y="71" text-anchor="middle" font-weight="600" fill="#1f1e1d">Bronze</text><text x="36" y="112" font-size="11.5" fill="#5e5d59">Checks</text><text x="36" y="130" font-size="11.5" fill="#1f1e1d">Arrival, row counts,</text><text x="36" y="146" font-size="11.5" fill="#1f1e1d">schema changes</text><text x="36" y="192" font-size="11.5" fill="#5e5d59">If a check fails</text><text x="36" y="210" font-size="11.5" fill="#1f1e1d">Keep the data</text><text x="36" y="226" font-size="11.5" fill="#1f1e1d">and alert</text></g><g><rect x="268" y="48" width="224" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="268" y="92" width="224" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="268" y="172" width="224" height="72" rx="6" fill="#d13b3b" fill-opacity="0.1" stroke="#d13b3b" stroke-width="1.25"></rect><text x="380" y="71" text-anchor="middle" font-weight="600" fill="#1f1e1d">Silver</text><text x="280" y="112" font-size="11.5" fill="#5e5d59">Checks</text><text x="280" y="130" font-size="11.5" fill="#1f1e1d">Keys, relationships,</text><text x="280" y="146" font-size="11.5" fill="#1f1e1d">valid values</text><text x="280" y="192" font-size="11.5" fill="#5e5d59">If a check fails</text><text x="280" y="210" font-size="11.5" fill="#1f1e1d">Quarantine rows, or stop</text><text x="280" y="226" font-size="11.5" fill="#1f1e1d">for key failures</text></g><g><rect x="512" y="48" width="224" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="512" y="92" width="224" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="512" y="172" width="224" height="72" rx="6" fill="#d13b3b" fill-opacity="0.1" stroke="#d13b3b" stroke-width="1.25"></rect><text x="624" y="71" text-anchor="middle" font-weight="600" fill="#1f1e1d">Gold</text><text x="524" y="112" font-size="11.5" fill="#5e5d59">Checks</text><text x="524" y="130" font-size="11.5" fill="#1f1e1d">Totals reconcile,</text><text x="524" y="146" font-size="11.5" fill="#1f1e1d">KPIs look sensible</text><text x="524" y="192" font-size="11.5" fill="#5e5d59">If a check fails</text><text x="524" y="210" font-size="11.5" fill="#1f1e1d">Do not publish; keep</text><text x="524" y="226" font-size="11.5" fill="#1f1e1d">the last good version</text></g></svg>
