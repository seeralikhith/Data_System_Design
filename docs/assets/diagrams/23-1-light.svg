<svg xmlns="http://www.w3.org/2000/svg" width="760" height="354" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 354" role="img" aria-label="Each job setting protects a different part of the run" font-size="13"><defs><marker id="job-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Each job setting protects a different part of the run</text><g><text x="379" y="52" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Concurrency limit: only one run of this job at a time</text><path d="M190 66V60H568V66" fill="none" stroke="#a9a79f" stroke-width="1.25"></path></g><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M154 98H190" marker-end="url(#job-arrow)"></path><path d="M300 98H324" marker-end="url(#job-arrow)"></path><path d="M434 98H458" marker-end="url(#job-arrow)"></path><path d="M568 98H640" stroke-dasharray="4 4" marker-end="url(#job-arrow)"></path></g><g fill="none" stroke="#a9a79f" stroke-width="1" stroke-dasharray="3 3"><path d="M89 122V150"></path><path d="M312 98V150"></path><path d="M513 122V150"></path><path d="M688 122V150"></path></g><g><rect x="24" y="74" width="130" height="48" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="89" y="102" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">run_date = Nov 4</text><rect x="190" y="74" width="110" height="48" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="324" y="74" width="110" height="48" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="458" y="74" width="110" height="48" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="245" y="102" text-anchor="middle" fill="#1f1e1d">Task 1</text><text x="379" y="102" text-anchor="middle" fill="#1f1e1d">Task 2</text><text x="513" y="102" text-anchor="middle" fill="#1f1e1d">Task 3</text><rect x="640" y="74" width="96" height="48" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="688" y="102" text-anchor="middle" fill="#1f1e1d">Alert</text><text x="604" y="90" text-anchor="middle" font-size="11.5" fill="#5e5d59">if it fails</text></g><g><rect x="24" y="150" width="166" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="206" y="150" width="166" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="388" y="150" width="166" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="570" y="150" width="166" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="36" y="172" font-weight="600" fill="#1f1e1d">Parameterized run</text><text x="36" y="190" font-size="11.5" fill="#5e5d59">Lets one job process</text><text x="36" y="206" font-size="11.5" fill="#5e5d59">any date</text><text x="218" y="172" font-weight="600" fill="#1f1e1d">Task dependency</text><text x="218" y="190" font-size="11.5" fill="#5e5d59">Task 2 waits until</text><text x="218" y="206" font-size="11.5" fill="#5e5d59">task 1 succeeds</text><text x="400" y="172" font-weight="600" fill="#1f1e1d">Retry and timeout</text><text x="400" y="190" font-size="11.5" fill="#5e5d59">Tries again, and stops</text><text x="400" y="206" font-size="11.5" fill="#5e5d59">a stuck task</text><text x="582" y="172" font-weight="600" fill="#1f1e1d">Alert</text><text x="582" y="190" font-size="11.5" fill="#5e5d59">Tells the owner when</text><text x="582" y="206" font-size="11.5" fill="#5e5d59">something fails</text></g><g><text x="24" y="258" font-weight="600" fill="#1f1e1d">Backfill: run the same job once for each past date</text><rect x="24" y="272" width="166" height="36" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="206" y="272" width="166" height="36" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="388" y="272" width="166" height="36" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="570" y="272" width="166" height="36" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M190 290H206" marker-end="url(#job-arrow)"></path><path d="M372 290H388" marker-end="url(#job-arrow)"></path><path d="M554 290H570" marker-end="url(#job-arrow)"></path></g><text x="107" y="294" text-anchor="middle" font-size="11.5" fill="#1f1e1d">run_date = Nov 1</text><text x="289" y="294" text-anchor="middle" font-size="11.5" fill="#1f1e1d">run_date = Nov 2</text><text x="471" y="294" text-anchor="middle" font-size="11.5" fill="#1f1e1d">run_date = Nov 3</text><text x="653" y="294" text-anchor="middle" font-size="11.5" fill="#1f1e1d">run_date = Nov 4</text><text x="24" y="332" font-size="11.5" fill="#5e5d59">Test one date first, run small batches, then reconcile the results.</text></g></svg>
