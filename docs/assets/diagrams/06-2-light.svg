ject storage</text><text x="380" y="254" text-anchor="middle" font-size="11.5" fill="#5e5d59">Flexible, can get messy</text></g><g><rect x="512" y="48" width="224" height="220" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="528" y="84" width="192" height="44" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="528" y="136" width="192" height="44" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><rect x="528" y="188" width="192" height="44" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="624" y="72" text-anchor="middle" font-weight="600" fill="#1f1e1d">Lakehouse</text><text x="624" y="110" text-anchor="middle" fill="#1f1e1d">SQL, BI, Spark and ML</text><text x="624" y="162" text-anchor="middle" font-weight="600" fill="#1f1e1d">Open table format</text><text x="624" y="214" text-anchor="middle" fill="#1f1e1d">Object storage</text><text x="624" y="254" text-anchor="middle" font-size="11.5" fill="#5e5d59">One copy of data for all uses</text></g></svg>
