<svg xmlns="http://www.w3.org/2000/svg" width="760" height="364" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 364" role="img" aria-label="In a star schema, every dimension joins directly to the fact table" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">In a star schema, every dimension joins directly to the fact table</text><text x="24" y="46" font-size="11.5" fill="#5e5d59">Numbers live in the fact table, and context lives in the dimensions</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M214 96H242V176H270"></path><path d="M214 304H242V224H270"></path><path d="M546 96H518V176H490"></path><path d="M546 304H518V224H490"></path></g><g><rect x="270" y="156" width="220" height="88" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="286" y="180" font-weight="600" fill="#1f1e1d">fct_order_line</text><text x="286" y="196" font-size="11.5" fill="#1f1e1d">Grain: one row per order line</text><text x="286" y="212" font-size="11.5" fill="#1f1e1d">Keys to each dimension</text><text x="286" y="228" font-size="11.5" fill="#1f1e1d">Measures: quantity, net_amount</text></g><g><rect x="24" y="60" width="190" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="84" font-weight="600" fill="#1f1e1d">dim_date</text><text x="40" y="100" font-size="11.5" fill="#5e5d59">Day, month, quarter, year</text><text x="40" y="116" font-size="11.5" fill="#5e5d59">Holiday flag</text></g><g><rect x="546" y="60" width="190" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="562" y="84" font-weight="600" fill="#1f1e1d">dim_customer</text><text x="562" y="100" font-size="11.5" fill="#5e5d59">Name, city, segment</text><text x="562" y="116" font-size="11.5" fill="#5e5d59">History kept as SCD Type 2</text></g><g><rect x="24" y="268" width="190" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="292" font-weight="600" fill="#1f1e1d">dim_product</text><text x="40" y="308" font-size="11.5" fill="#5e5d59">Name, category, brand</text><text x="40" y="324" font-size="11.5" fill="#5e5d59">Supplier</text></g><g><rect x="546" y="268" width="190" height="72" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="562" y="292" font-weight="600" fill="#1f1e1d">dim_store</text><text x="562" y="308" font-size="11.5" fill="#5e5d59">Store name, region</text><text x="562" y="324" font-size="11.5" fill="#5e5d59">Store manager</text></g></svg>
