<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 220" role="img" aria-label="Four ways to lay data out on disk, and what each is good for" font-size="11.5"><defs><marker id="lay-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Four ways to lay data out on disk, and what each is good for</text><g><rect x="24" y="48" width="166" height="148" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Partitioning</text><rect x="36" y="92" width="44" height="40" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><rect x="86" y="92" width="44" height="40" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><rect x="136" y="92" width="44" height="40" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><text x="58" y="116" text-anchor="middle" fill="#1f1e1d">Nov 1</text><text x="108" y="116" text-anchor="middle" fill="#1f1e1d">Nov 2</text><text x="158" y="116" text-anchor="middle" fill="#1f1e1d">Nov 3</text><text x="36" y="166" fill="#5e5d59">Good for</text><text x="36" y="182" fill="#1f1e1d">Filters on date</text></g><g><rect x="206" y="48" width="166" height="148" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="218" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Bucketing</text><text x="218" y="92" fill="#5e5d59">hash(key) picks a bucket</text><rect x="218" y="104" width="32" height="28" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><rect x="256" y="104" width="32" height="28" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><rect x="294" y="104" width="32" height="28" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><rect x="332" y="104" width="32" height="28" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><text x="234" y="122" text-anchor="middle" fill="#1f1e1d">B1</text><text x="272" y="122" text-anchor="middle" fill="#1f1e1d">B2</text><text x="310" y="122" text-anchor="middle" fill="#1f1e1d">B3</text><text x="348" y="122" text-anchor="middle" fill="#1f1e1d">B4</text><text x="218" y="166" fill="#5e5d59">Good for</text><text x="218" y="182" fill="#1f1e1d">Joins on one key</text></g><g><rect x="388" y="48" width="166" height="148" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="400" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Clustering</text><text x="400" y="92" fill="#5e5d59">Similar values kept together</text><rect x="400" y="104" width="46" height="28" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><rect x="452" y="104" width="46" height="28" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><rect x="504" y="104" width="46" height="28" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1"></rect><text x="423" y="122" text-anchor="middle" fill="#1f1e1d">A to F</text><text x="475" y="122" text-anchor="middle" fill="#1f1e1d">G to M</text><text x="527" y="122" text-anchor="middle" fill="#1f1e1d">N to Z</text><text x="400" y="166" fill="#5e5d59">Good for</text><text x="400" y="182" fill="#1f1e1d">Filters on many values</text></g><g><rect x="570" y="48" width="166" height="148" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="582" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Index</text><text x="582" y="92" fill="#5e5d59">A lookup that points to rows</text><rect x="582" y="104" width="56" height="28" rx="3" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6"