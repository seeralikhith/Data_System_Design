<svg xmlns="http://www.w3.org/2000/svg" width="760" height="222" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 222" role="img" aria-label="A DAG runs tasks in dependency order, with no loops" font-size="13"><defs><marker id="dag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#76746d"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">A DAG runs tasks in dependency order, with no loops</text><text x="24" y="46" font-size="11.5" fill="#a9a7a0">The two load tasks can run together, and the next task waits for both</text><g fill="none" stroke="#76746d" stroke-width="1.25"><path d="M174 94H189V134H204" marker-end="url(#dag-arrow)"></path><path d="M174 174H189V134H204" marker-end="url(#dag-arrow)"></path><path d="M354 134H384" marker-end="url(#dag-arrow)"></path><path d="M534 134H564" marker-end="url(#dag-arrow)"></path></g><g><rect x="24" y="70" width="150" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="99" y="98" text-anchor="middle" fill="#ecebe7">Load orders</text></g><g><rect x="24" y="150" width="150" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="99" y="178" text-anchor="middle" fill="#ecebe7">Load payments</text></g><g><rect x="204" y="110" width="150" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="279" y="138" text-anchor="middle" fill="#ecebe7">Clean and join</text></g><g><rect x="384" y="110" width="150" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="459" y="138" text-anchor="middle" fill="#ecebe7">Build revenue table</text></g><g><rect x="564" y="110" width="150" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="639" y="138" text-anchor="middle" fill="#ecebe7">Refresh dashboard</text></g></svg>
