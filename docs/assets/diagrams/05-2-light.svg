<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="Three common ways data gets into a platform" font-size="13"><defs><marker id="ways-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Three common ways data gets into a platform</text><g><text x="24" y="84" font-weight="600" fill="#1f1e1d">CDC</text><text x="24" y="102" font-size="11.5" fill="#5e5d59">Change data capture copies</text><text x="24" y="118" font-size="11.5" fill="#5e5d59">only what changed</text><text x="285" y="54" text-anchor="middle" font-size="11.5" fill="#5e5d59">Source table</text><rect x="220" y="60" width="130" height="70" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="230" y="68" width="110" height="10" rx="2" fill="#e3e1da" fill-opacity="1"></rect><rect x="230" y="82" width="110" height="10" rx="2" fill="#2a6fd6" fill-opacity="0.5"></rect><rect x="230" y="96" width="110" height="10" rx="2" fill="#e3e1da" fill-opacity="1"></rect><rect x="230" y="110" width="110" height="10" rx="2" fill="#2a6fd6" fill-opacity="0.5"></rect><path d="M350 95H490" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#ways-arrow)"></path><text x="420" y="87" text-anchor="middle" font-size="11.5" fill="#5e5d59">only the changes</text><text x="555" y="54" text-anchor="middle" font-size="11.5" fill="#5e5d59">Platform</text><rect x="490" y="60" width="130" height="70" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="500" y="82" width="110" height="10" rx="2" fill="#2a6fd6" fill-opacity="0.5"></rect><rect x="500" y="96" width="110" height="10" rx="2" fill="#2a6fd6" fill-opacity="0.5"></rect></g><line x1="24" x2="736" y1="146" y2="146" stroke="#e3e1da"></line><g><text x="24" y="172" font-weight="600" fill="#1f1e1d">Pull</text><text x="24" y="188" font-size="11.5" fill="#5e5d59">Like checking a mailbox</text><rect x="220" y="160" width="130" height="32" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="490" y="160" width="130" height="32" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M350 176H490" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#ways-arrow)"></path><text x="285" y="180" text-anchor="middle" fill="#1f1e1d">Platform</text><text x="555" y="180" text-anchor="middle" fill="#1f1e1d">Source</text><text x="420" y="168" text-anchor="middle" font-size="11.5" fill="#5e5d59">asks for data</text></g><g><text x="24" y="220" font-weight="600" fill="#1f1e1d">Push</text><text x="24" y="236" font-size="11.5" fill="#5e5d59">Like a courier at your door</text><rect x="220" y="208" width="130" height="32" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="490" y="208" width="130" height="32" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M350 224H490" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#ways-arrow)"></path><text x="285" y="228" text-anchor="middle" fill="#1f1e1d">Source</text><text x="555" y="228" text-anchor="middle" fill="#1f1e1d">Platform</text><text x="420" y="216" text-anchor="middle" font-size="11.5" fill="#5e5d59">sends data</text></g><line x1="24" x2="736" y1="252" y2="252" stroke="#e3e1da"></line><g><text x="24" y="304" font-weight="600" fill="#1f1e1d">Event broker</text><text x="24" y="320" font-size="11.5" fill="#5e5d59">Such as Kafka, works like</text><text x="24" y="336" font-size="11.5" fill="#5e5d59">a post office</text><text x="275" y="270" text-anchor="middle" font-size="11.5" fill="#5e5d59">Producers</text><text x="673" y="270" text-anchor="middle" font-size="11.5" fill="#5e5d59">Consumers</text><rect x="220" y="278" width="110" height="32" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="220" y="322" width="110" height="32" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="610" y="278" width="126" height="32" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="610" y="322" width="126" height="32" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="275" y="298" text-anchor="middle" fill="#1f1e1d">Orders app</text><text x="275" y="342" text-anchor="middle" fill="#1f1e1d">Website</text><text x="673" y="298" text-anchor="middle" fill="#1f1e1d">Spark job</text><text x="673" y="342" text-anchor="middle" fill="#1f1e1d">Alert service</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M330 294H355V316H380" marker-end="url(#ways-arrow)"></path><path d="M330 338H355V316H380" marker-end="url(#ways-arrow)"></path><path d="M560 316H585V294H610" marker-end="url(#ways-arrow)"></path><path d="M560 316H585V338H610" marker-end="url(#ways-arrow)"></path></g><rect x="380" y="288" width="180" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="470" y="312" text-anchor="middle" font-weight="600" fill="#1f1e1d">Topic</text><text x="470" y="330" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Holds events in order</text><text x="220" y="376" font-size="11.5" fill="#5e5d59">Decoupling: either side can change or slow down without breaking the other</text></g></svg>
