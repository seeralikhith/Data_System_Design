<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 228" role="img" aria-label="Reliability terms at a glance" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Reliability terms at a glance</text><g><rect x="24" y="48" width="166" height="72" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="206" y="48" width="166" height="72" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="388" y="48" width="166" height="72" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="570" y="48" width="166" height="72" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="24" y="132" width="166" height="72" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="206" y="132" width="166" height="72" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="388" y="132" width="166" height="72" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="570" y="132" width="166" height="72" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#ecebe7">Fault tolerance</text><text x="36" y="88" fill="#a9a7a0">Keeps working, or</text><text x="36" y="104" fill="#a9a7a0">recovers, when a part fails</text><text x="218" y="70" font-size="13" font-weight="600" fill="#ecebe7">SPOF</text><text x="218" y="88" fill="#a9a7a0">Single point of failure:</text><text x="218" y="104" fill="#a9a7a0">one part that stops all</text><text x="400" y="70" font-size="13" font-weight="600" fill="#ecebe7">High availability</text><text x="400" y="88" fill="#a9a7a0">Spare capacity, so there</text><text x="400" y="104" fill="#a9a7a0">is very little downtime</text><text x="582" y="70" font-size="13" font-weight="600" fill="#ecebe7">Replication</text><text x="582" y="88" fill="#a9a7a0">Copies of data kept in</text><text x="582" y="104" fill="#a9a7a0">more than one place</text><text x="36" y="154" font-size="13" font-weight="600" fill="#ecebe7">Disaster recovery</text><text x="36" y="172" fill="#a9a7a0">The plan for restoring</text><text x="36" y="188" fill="#a9a7a0">after a major outage</text><text x="218" y="154" font-size="13" font-weight="600" fill="#ecebe7">Replay</text><text x="218" y="172" fill="#a9a7a0">Reprocessing stored</text><text x="218" y="188" fill="#a9a7a0">raw data</text><text x="400" y="154" font-size="13" font-weight="600" fill="#ecebe7">Backfill</text><text x="400" y="172" fill="#a9a7a0">Running a pipeline</text><text x="400" y="188" fill="#a9a7a0">for a past period</text><text x="582" y="154" font-size="13" font-weight="600" fill="#ecebe7">RPO and RTO</text><text x="582" y="172" fill="#ecebe7">Data you can lose, and</text><text x="582" y="188" fill="#ecebe7">time you can be down</text></g></svg>
