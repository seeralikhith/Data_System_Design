<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 320" role="img" aria-label="Five safeguards that make ingestion reliable" font-size="11.5"><defs><marker id="ing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Five safeguards that make ingestion reliable</text><g><rect x="24" y="48" width="224" height="124" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Applying CDC events</text><rect x="36" y="80" width="200" height="20" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1"></rect><rect x="36" y="104" width="200" height="20" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1"></rect><rect x="36" y="128" width="200" height="20" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1"></rect><text x="44" y="94" fill="#1f1e1d">LSN 101: insert order 17</text><text x="44" y="118" fill="#1f1e1d">LSN 102: update order 17</text><text x="44" y="142" fill="#1f1e1d">LSN 103: delete order 17</text><text x="36" y="164" fill="#5e5d59">Applied in sequence order</text></g><g><rect x="268" y="48" width="224" height="124" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="280" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Checkpoint</text><rect x="280" y="106" width="200" height="14" rx="3" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="280" y="106" width="120" height="14" rx="3" fill="#2a6fd6" fill-opacity="0.4"></rect><path d="M400 92V128" fill="none" stroke="#2a6fd6" stroke-width="2"></path><text x="404" y="98" fill="#1f1e1d">Saved progress</text><text x="380" y="150" text-anchor="middle" fill="#5e5d59">After a failure, restart from here</text></g><g><rect x="512" y="48" width="224" height="124" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="524" y="70" font-size="13" font-weight="600" fill="#1f1e1d">Pagination</text><rect x="524" y="96" width="56" height="40" rx="4" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="588" y="96" width="56" height="40" rx="4" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="652" y="96" width="56" height="40" rx="4" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="552" y="120" text-anchor="middle" fill="#1f1e1d">Page 1</text><text x="616" y="120" text-anchor="middle" fill="#1f1e1d">Page 2</text><text x="680" y="120" text-anchor="middle" fill="#1f1e1d">Page 3</text><text x="624" y="158" text-anchor="middle" fill="#5e5d59">A cursor marks the next page</text></g><g><rect x="24" y="184" width="344" height="112" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="36" y="206" font-size="13" font-weight="600" fill="#1f1e1d">Rate limits</text><rect x="40" y="228" width="96" height="28" rx="4" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="160" y="228" width="80" height="28" rx="4" fill="#d13b3b" fill-opacity="0.12" stroke="#d13b3b" stroke-width="1.25"></rect><rect x="264" y="228" width="96" height="28" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1"></rect><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M136 242H160" marker-end="url(#ing-arrow)"></path><path d="M240 242H264" marker-end="url(#ing-arrow)"></path></g><text x="88" y="246" text-anchor="middle" fill="#1f1e1d">Too many calls</text><text x="200" y="246" text-anchor="middle" font-weight="600" fill="#1f1e1d">HTTP 429</text><text x="312" y="246" text-anchor="middle" fill="#1f1e1d">Wait, retry</text><text x="36" y="280" fill="#5e5d59">The API caps how many requests you can make</text></g><g><rect x="392" y="184" width="344" height="112" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="404" y="206" font-size="13" font-weight="600" fill="#1f1e1d">Ingestion metadata</text><rect x="408" y="228" width="64" height="26" fill="#eeede8" stroke="#a9a79f" stroke-width="1"></rect><rect x="472" y="228" width="88" height="26" fill="#2a6fd6" fill-opacity="0.14" stroke="#a9a79f" stroke-width="1"></rect><rect x="560" y="228" width="88" height="26" fill="#2a6fd6" fill-opacity="0.14" stroke="#a9a79f" stroke-width="1"></rect><rect x="648" y="228" width="72" height="26" fill="#2a6fd6" fill-opacity="0.14" stroke="#a9a79f" stroke-width="1"></rect><text x="416" y="245" fill="#1f1e1d">order_id</text><text x="480" y="245" fill="#1f1e1d">_ingested_at</text><text x="568" y="245" fill="#1f1e1d">_source_file</text><text x="656" y="245" fill="#1f1e1d">_run_id</text><text x="404" y="280" fill="#5e5d59">Shaded columns are added to every Bronze row</text></g></svg>
