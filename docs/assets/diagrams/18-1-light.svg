<svg xmlns="http://www.w3.org/2000/svg" width="760" height="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 224" role="img" aria-label="A rerun should change nothing: MERGE is safe, and a plain INSERT is not" font-size="13"><defs><marker id="idem-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">A rerun should change nothing: MERGE is safe, and a plain INSERT is not</text><text x="270" y="60" text-anchor="middle" font-size="11.5" fill="#5e5d59">Table after the first run</text><text x="460" y="60" text-anchor="middle" font-size="11.5" fill="#5e5d59">Table after a rerun</text><text x="570" y="60" font-size="11.5" fill="#5e5d59">Result</text><g><text x="24" y="90" font-weight="600" fill="#1f1e1d">INSERT</text><text x="24" y="106" font-size="11.5" fill="#5e5d59">Always adds rows</text><rect x="190" y="72" width="160" height="28" rx="4" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M350 86H380" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#idem-arrow)"></path><rect x="380" y="72" width="160" height="28" rx="4" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="380" y="106" width="160" height="28" rx="4" fill="#d13b3b" fill-opacity="0.12" stroke="#d13b3b" stroke-width="2"></rect><text x="270" y="90" text-anchor="middle" fill="#1f1e1d">Order 17</text><text x="460" y="90" text-anchor="middle" fill="#1f1e1d">Order 17</text><text x="460" y="124" text-anchor="middle" font-weight="600" fill="#1f1e1d">Order 17 (duplicate)</text><circle cx="576" cy="100" r="5" fill="#d13b3b"></circle><text x="588" y="104" font-weight="600" fill="#1f1e1d">Wrong: counted twice</text></g><line x1="24" x2="736" y1="150" y2="150" stroke="#e3e1da"></line><g><text x="24" y="180" font-weight="600" fill="#1f1e1d">MERGE</text><text x="24" y="196" font-size="11.5" fill="#5e5d59">Matches on a key first</text><rect x="190" y="166" width="160" height="28" rx="4" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><path d="M350 180H380" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#idem-arrow)"></path><rect x="380" y="166" width="160" height="28" rx="4" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="270" y="184" text-anchor="middle" fill="#1f1e1d">Order 17</text><text x="460" y="184" text-anchor="middle" fill="#1f1e1d">Order 17</text><circle cx="576" cy="180" r="5" fill="#1e9e3a"></circle><text x="588" y="184" font-weight="600" fill="#1f1e1d">Right: same result</text></g></svg>
