<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 268" role="img" aria-label="During a network partition, a system must choose consistency or availability" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">During a network partition, a system must choose consistency or availability</text><g><rect x="150" y="52" width="160" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="450" y="52" width="160" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="230" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Copy A</text><text x="530" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Copy B</text><path d="M310 76H370M390 76H450" fill="none" stroke="#d13b3b" stroke-width="2" stroke-dasharray="5 4"></path><path d="M374 68L386 84M386 68L374 84" fill="none" stroke="#d13b3b" stroke-width="2"></path><text x="380" y="116" text-anchor="middle" font-weight="600" fill="#1f1e1d">Network partition: the copies cannot talk</text></g><g><rect x="24" y="136" width="344" height="84" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="40" y="160" font-size="13" font-weight="600" fill="#1f1e1d">Choose consistency</text><text x="40" y="178" fill="#1f1e1d">Everyone sees the latest data, but some requests fail</text><text x="40" y="204" fill="#5e5d59">Example: a bank balance</text></g><g><rect x="392" y="136" width="344" height="84" rx="8" fill="#e0683b" fill-opacity="0.12" stroke="#e0683b" stroke-width="1.25"></rect><text x="408" y="160" font-size="13" font-weight="600" fill="#1f1e1d">Choose availability</text><text x="408" y="178" fill="#1f1e1d">Every request is answered, but data may be old</text><text x="408" y="204" fill="#5e5d59">Example: a click counter</text></g><text x="24" y="248" fill="#5e5d59">Eventual consistency: copies may differ briefly, then catch up once they can talk again.</text></svg>
