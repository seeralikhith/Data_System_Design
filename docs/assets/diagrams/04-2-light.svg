<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 230" role="img" aria-label="Choose the simplest model that keeps data fresh enough" font-size="11.5"><defs><marker id="spec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a6fd6"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Choose the simplest model that keeps data fresh enough</text><text x="24" y="50" fill="#5e5d59">Simpler and cheaper</text><text x="736" y="50" text-anchor="end" fill="#5e5d59">Fresher, but harder and costlier</text><path d="M24 62H736" fill="none" stroke="#2a6fd6" stroke-width="2" marker-end="url(#spec-arrow)"></path><g><rect x="24" y="76" width="224" height="130" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="100" font-size="13" font-weight="600" fill="#1f1e1d">Batch</text><text x="40" y="122" fill="#5e5d59">Freshness</text><text x="40" y="138" fill="#1f1e1d">Hours to a day</text><text x="40" y="162" fill="#5e5d59">Good for</text><text x="40" y="178" fill="#1f1e1d">Daily reports</text></g><g><rect x="268" y="76" width="224" height="130" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="284" y="100" font-size="13" font-weight="600" fill="#1f1e1d">Micro-batch</text><text x="284" y="122" fill="#5e5d59">Freshness</text><text x="284" y="138" fill="#1f1e1d">Seconds to minutes</text><text x="284" y="162" fill="#5e5d59">Good for</text><text x="284" y="178" fill="#1f1e1d">Near-real-time dashboards</text></g><g><rect x="512" y="76" width="224" height="130" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="528" y="100" font-size="13" font-weight="600" fill="#1f1e1d">Streaming</text><text x="528" y="122" fill="#5e5d59">Freshness</text><text x="528" y="138" fill="#1f1e1d">Milliseconds to seconds</text><text x="528" y="162" fill="#5e5d59">Good for</text><text x="528" y="178" fill="#1f1e1d">Fraud checks, live alerts</text></g></svg>
