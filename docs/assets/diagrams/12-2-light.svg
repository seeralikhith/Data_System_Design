<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 300" role="img" aria-label="Storage and compute scale separately, so each workload gets its own power" font-size="11.5"><defs><marker id="sc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Storage and compute scale separately, so each workload gets its own power</text><g><rect x="24" y="52" width="224" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="268" y="52" width="224" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="512" y="52" width="224" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="136" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">ETL cluster</text><text x="136" y="94" text-anchor="middle" fill="#1f1e1d">Running</text><text x="380" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">BI warehouse</text><text x="380" y="94" text-anchor="middle" fill="#1f1e1d">Running</text><text x="624" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">ML cluster</text><text x="624" y="94" text-anchor="middle" fill="#5e5d59">Stopped, so it costs nothing</text></g><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M136 108V148" marker-end="url(#sc-arrow)"></path><path d="M380 108V148" marker-end="url(#sc-arrow)"></path><path d="M624 108V148" stroke-dasharray="4 4" marker-end="url(#sc-arrow)"></path></g><g><rect x="24" y="148" width="712" height="48" rx="8" fill="#eeede8" stroke="#a9a79f" stroke-width="1.25"></rect><text x="380" y="177" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Shared object storage: one copy of the data</text></g><g><rect x="24" y="220" width="224" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="268" y="220" width="224" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="512" y="220" width="224" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="36" y="242" font-size="13" font-weight="600" fill="#1f1e1d">Partitioning</text><text x="36" y="260" fill="#5e5d59">Split data so machines work at once</text><text x="280" y="242" font-size="13" font-weight="600" fill="#1f1e1d">Autoscaling</text><text x="280" y="260" fill="#5e5d59">Add or remove machines as needed</text><text x="524" y="242" font-size="13" font-weight="600" fill="#1f1e1d">Workload isolation</text><text x="524" y="260" fill="#5e5d59">ETL and BI on separate compute</text></g></svg>
