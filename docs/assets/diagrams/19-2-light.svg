<svg xmlns="http://www.w3.org/2000/svg" width="760" height="272" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 272" role="img" aria-label="A broadcast join copies the small table, and a shuffle join moves both sides" font-size="13"><defs><marker id="join-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">A broadcast join copies the small table; a shuffle join moves both sides</text><g><rect x="24" y="48" width="344" height="200" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="196" y="68" text-anchor="middle" font-weight="600" fill="#1f1e1d">Broadcast join</text><text x="196" y="84" text-anchor="middle" font-size="11.5" fill="#5e5d59">Less data moves, but one table must be small</text><rect x="128" y="94" width="136" height="32" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="196" y="114" text-anchor="middle" font-weight="600" fill="#1f1e1d">Small table</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M196 126V142"></path><path d="M88 142H304"></path><path d="M88 142V160" marker-end="url(#join-arrow)"></path><path d="M196 142V160" marker-end="url(#join-arrow)"></path><path d="M304 142V160" marker-end="url(#join-arrow)"></path></g><rect x="40" y="160" width="96" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="148" y="160" width="96" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="256" y="160" width="96" height="72" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="88" y="180" text-anchor="middle" font-weight="600" fill="#1f1e1d">Worker 1</text><text x="88" y="198" text-anchor="middle" font-size="11.5" fill="#5e5d59">Large table part</text><text x="88" y="214" text-anchor="middle" font-size="11.5" fill="#1f1e1d">+ small copy</text><text x="196" y="180" text-anchor="middle" font-weight="600" fill="#1f1e1d">Worker 2</text><text x="196" y="198" text-anchor="middle" font-size="11.5" fill="#5e5d59">Large table part</text><text x="196" y="214" text-anchor="middle" font-size="11.5" fill="#1f1e1d">+ small copy</text><text x="304" y="180" text-anchor="middle" font-weight="600" fill="#1f1e1d">Worker 3</text><text x="304" y="198" text-anchor="middle" font-size="11.5" fill="#5e5d59">Large table part</text><text x="304" y="214" text-anchor="middle" font-size="11.5" fill="#1f1e1d">+ small copy</text></g><g><rect x="392" y="48" width="344" height="200" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="564" y="68" text-anchor="middle" font-weight="600" fill="#1f1e1d">Shuffle join</text><text x="564" y="84" text-anchor="middle" font-size="11.5" fill="#5e5d59">Rows move so that matching keys meet</text><rect x="408" y="94" width="96" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="516" y="94" width="96" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="624" y="94" width="96" height="36" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="456" y="116" text-anchor="middle" fill="#5e5d59">Keys A, B</text><text x="564" y="116" text-anchor="middle" fill="#5e5d59">Keys B, C</text><text x="672" y="116" text-anchor="middle" fill="#5e5d59">Keys A, C</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M456 130V180" marker-end="url(#join-arrow)"></path><path d="M470 130L550 180" marker-end="url(#join-arrow)"></path><path d="M564 130V180" marker-end="url(#join-arrow)"></path><path d="M578 130L658 180" marker-end="url(#join-arrow)"></path><path d="M640 130L480 180" marker-end="url(#join-arrow)"></path><path d="M672 130V180" marker-end="url(#join-arrow)"></path></g><rect x="408" y="180" width="96" height="52" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><rect x="516" y="180" width="96" height="52" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><rect x="624" y="180" width="96" height="52" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="456" y="210" text-anchor="middle" font-weight="600" fill="#1f1e1d">All key A</text><text x="564" y="210" text-anchor="middle" font-weight="600" fill="#1f1e1d">All key B</text><text x="672" y="210" text-anchor="middle" font-weight="600" fill="#1f1e1d">All key C</text></g></svg>
