<svg xmlns="http://www.w3.org/2000/svg" width="760" height="224" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 224" role="img" aria-label="A rerun should change nothing: MERGE is safe, and a plain INSERT is not" font-size="13"><defs><marker id="idem-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#76746d"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">A rerun should change nothing: MERGE is safe, and a plain INSERT is not</text><text x="270" y="60" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Table after the first run</text><text x="460" y="60" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Table after a rerun</text><text x="570" y="60" font-size="11.5" fill="#a9a7a0">Result</text><g><text x="24" y="90" font-weight="600" fill="#ecebe7">INSERT</text><text x="24" y="106" font-size="11.5" fill="#a9a7a0">Always adds rows</text><rect x="190" y="72" width="160" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M350 86H380" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#idem-arrow)"></path><rect x="380" y="72" width="160" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="380" y="106" width="160" height="28" rx="4" fill="#f06a6a" fill-opacity="0.12" stroke="#f06a6a" stroke-width="2"></rect><text x="270" y="90" text-anchor="middle" fill="#ecebe7">Order 17</text><text x="460" y="90" text-anchor="middle" fill="#ecebe7">Order 17</text><text x="460" y="124" text-anchor="middle" font-weight="600" fill="#ecebe7">Order 17 (duplicate)</text><circle cx="576" cy="100" r="5" fill="#f06a6a"></circle><text x="588" y="104" font-weight="600" fill="#ecebe7">Wrong: counted twice</text></g><line x1="24" x2="736" y1="150" y2="150" stroke="#3a3936"></line><g><text x="24" y="180" font-weight="600" fill="#ecebe7">MERGE</text><text x="24" y="196" font-size="11.5" fill="#a9a7a0">Matches on a key first</text><rect x="190" y="166" width="160" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M350 180H380" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#idem-arrow)"></path><rect x="380" y="166" width="160" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="270" y="184" text-anchor="middle" fill="#ecebe7">Order 17</text><text x="460" y="184" text-anchor="middle" fill="#ecebe7">Order 17</text><circle cx="576" cy="180" r="5" fill="#4cc566"></circle><text x="588" y="184" font-weight="600" fill="#ecebe7">Right: same result</text></g></svg>
