<svg xmlns="http://www.w3.org/2000/svg" width="760" height="398" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 398" role="img" aria-label="Each technique cuts down the data a query must read" font-size="13"><text x="24" y="26" font-size="15" font-weight="600" fill="#ecebe7">Each technique cuts down the data a query must read</text><text x="24" y="44" font-size="11.5" fill="#a9a7a0">Bar widths are illustrative</text><g><rect x="350" y="60" width="380" height="36" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="24" y="75" font-weight="600" fill="#ecebe7">Whole table</text><text x="24" y="91" font-size="11.5" fill="#a9a7a0">Everything a query could read</text></g><g><rect x="400" y="108" width="280" height="36" rx="4" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="24" y="123" font-weight="600" fill="#ecebe7">Partition pruning</text><text x="24" y="139" font-size="11.5" fill="#a9a7a0">Skips partitions that cannot match</text></g><g><rect x="445" y="156" width="190" height="36" rx="4" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="24" y="171" font-weight="600" fill="#ecebe7">Data skipping</text><text x="24" y="187" font-size="11.5" fill="#a9a7a0">Skips files using min and max values</text></g><g><rect x="485" y="204" width="110" height="36" rx="4" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="24" y="219" font-weight="600" fill="#ecebe7">Columnar format</text><text x="24" y="235" font-size="11.5" fill="#a9a7a0">Reads only the columns needed</text></g><g><rect x="515" y="252" width="50" height="36" rx="4" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="24" y="267" font-weight="600" fill="#ecebe7">Predicate pushdown</text><text x="24" y="283" font-size="11.5" fill="#a9a7a0">Filters rows during the scan</text></g><text x="24" y="312" font-weight="600" fill="#ecebe7">Or avoid reading the table at all</text><g><rect x="24" y="322" width="224" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="268" y="322" width="224" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="512" y="322" width="224" height="52" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><text x="36" y="344" font-weight="600" fill="#ecebe7">Caching</text><text x="36" y="362" font-size="11.5" fill="#a9a7a0">Keeps recent results ready</text><text x="280" y="344" font-weight="600" fill="#ecebe7">Materialized views</text><text x="280" y="362" font-size="11.5" fill="#a9a7a0">Store a result, then refresh it</text><text x="524" y="344" font-weight="600" fill="#ecebe7">Pre-aggregation</text><text x="524" y="362" font-size="11.5" fill="#a9a7a0">Stores totals in advance</text></g></svg>
