<svg xmlns="http://www.w3.org/2000/svg" width="760" height="398" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 398" role="img" aria-label="Each technique cuts down the data a query must read" font-size="13"><text x="24" y="26" font-size="15" font-weight="600" fill="#1f1e1d">Each technique cuts down the data a query must read</text><text x="24" y="44" font-size="11.5" fill="#5e5d59">Bar widths are illustrative</text><g><rect x="350" y="60" width="380" height="36" rx="4" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="24" y="75" font-weight="600" fill="#1f1e1d">Whole table</text><text x="24" y="91" font-size="11.5" fill="#5e5d59">Everything a query could read</text></g><g><rect x="400" y="108" width="280" height="36" rx="4" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="24" y="123" font-weight="600" fill="#1f1e1d">Partition pruning</text><text x="24" y="139" font-size="11.5" fill="#5e5d59">Skips partitions that cannot match</text></g><g><rect x="445" y="156" width="190" height="36" rx="4" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="24" y="171" font-weight="600" fill="#1f1e1d">Data skipping</text><text x="24" y="187" font-size="11.5" fill="#5e5d59">Skips files using min and max values</text></g><g><rect x="485" y="204" width="110" height="36" rx="4" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="24" y="219" font-weight="600" fill="#1f1e1d">Columnar format</text><text x="24" y="235" font-size="11.5" fill="#5e5d59">Reads only the columns needed</text></g><g><rect x="515" y="252" width="50" height="36" rx="4" fill="#2a6fd6" fill-opacity="0.14" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="24" y="267" font-weight="600" fill="#1f1e1d">Predicate pushdown</text><text x="24" y="283" font-size="11.5" fill="#5e5d59">Filters rows during the scan</text></g><text x="24" y="312" font-weight="600" fill="#1f1e1d">Or avoid reading the table at all</text><g><rect x="24" y="322" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="268" y="322" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="512" y="322" width="224" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1"></rect><text x="36" y="344" font-weight="600" fill="#1f1e1d">Caching</text><text x="36" y="362" font-size="11.5" fill="#5e5d59">Keeps recent results ready</text><text x="280" y="344" font-weight="600" fill="#1f1e1d">Materialized views</text><text x="280" y="362" font-size="11.5" fill="#5e5d59">Store a result, then refresh it</text><text x="524" y="344" font-weight="600" fill="#1f1e1d">Pre-aggregation</text><text x="524" y="362" font-size="11.5" fill="#5e5d59">Stores totals in advance</text></g></svg>
