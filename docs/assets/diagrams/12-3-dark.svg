<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 268" role="img" aria-label="During a network partition, a system must choose consistency or availability" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">During a network partition, a system must choose consistency or availability</text><g><rect x="150" y="52" width="160" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="450" y="52" width="160" height="48" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="230" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#ecebe7">Copy A</text><text x="530" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#ecebe7">Copy B</text><path d="M310 76H370M390 76H450" fill="none" stroke="#f06a6a" stroke-width="2" stroke-dasharray="5 4"></path><path d="M374 68L386 84M386 68L374 84" fill="none" stroke="#f06a6a" stroke-width="2"></path><text x="380" y="116" text-anchor="middle" font-weight="600" fill="#ecebe7">Network partition: the copies cannot talk</text></g><g><rect x="24" y="136" width="344" height="84" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="40" y="160" font-size="13" font-weight="600" fill="#ecebe7">Choose consistency</text><text x="40" y="178" fill="#ecebe7">Everyone sees the latest data, but some requests fail</text><text x="40" y="204" fill="#a9a7a0">Example: a bank balance</text></g><g><rect x="392" y="136" width="344" height="84" rx="8" fill="#f08c5f" fill-opacity="0.12" stroke="#f08c5f" stroke-width="1.25"></rect><text x="408" y="160" font-size="13" font-weight="600" fill="#ecebe7">Choose availability</text><text x="408" y="178" fill="#ecebe7">Every request is answered, but data may be old</text><text x="408" y="204" fill="#a9a7a0">Example: a click counter</text></g><text x="24" y="248" fill="#a9a7a0">Eventual consistency: copies may differ briefly, then catch up once they can talk again.</text></svg>
