<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 220" role="img" aria-label="Four ways to lay data out on disk, and what each is good for" font-size="11.5"><defs><marker id="lay-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#76746d"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Four ways to lay data out on disk, and what each is good for</text><g><rect x="24" y="48" width="166" height="148" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#ecebe7">Partitioning</text><rect x="36" y="92" width="44" height="40" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><rect x="86" y="92" width="44" height="40" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><rect x="136" y="92" width="44" height="40" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><text x="58" y="116" text-anchor="middle" fill="#ecebe7">Nov 1</text><text x="108" y="116" text-anchor="middle" fill="#ecebe7">Nov 2</text><text x="158" y="116" text-anchor="middle" fill="#ecebe7">Nov 3</text><text x="36" y="166" fill="#a9a7a0">Good for</text><text x="36" y="182" fill="#ecebe7">Filters on date</text></g><g><rect x="206" y="48" width="166" height="148" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="218" y="70" font-size="13" font-weight="600" fill="#ecebe7">Bucketing</text><text x="218" y="92" fill="#a9a7a0">hash(key) picks a bucket</text><rect x="218" y="104" width="32" height="28" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><rect x="256" y="104" width="32" height="28" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><rect x="294" y="104" width="32" height="28" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><rect x="332" y="104" width="32" height="28" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><text x="234" y="122" text-anchor="middle" fill="#ecebe7">B1</text><text x="272" y="122" text-anchor="middle" fill="#ecebe7">B2</text><text x="310" y="122" text-anchor="middle" fill="#ecebe7">B3</text><text x="348" y="122" text-anchor="middle" fill="#ecebe7">B4</text><text x="218" y="166" fill="#a9a7a0">Good for</text><text x="218" y="182" fill="#ecebe7">Joins on one key</text></g><g><rect x="388" y="48" width="166" height="148" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="400" y="70" font-size="13" font-weight="600" fill="#ecebe7">Clustering</text><text x="400" y="92" fill="#a9a7a0">Similar values kept together</text><rect x="400" y="104" width="46" height="28" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><rect x="452" y="104" width="46" height="28" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><rect x="504" y="104" width="46" height="28" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2" stroke-width="1"></rect><text x="423" y="122" text-anchor="middle" fill="#ecebe7">A to F</text><text x="475" y="122" text-anchor="middle" fill="#ecebe7">G to M</text><text x="527" y="122" text-anchor="middle" fill="#ecebe7">N to Z</text><text x="400" y="166" fill="#a9a7a0">Good for</text><text x="400" y="182" fill="#ecebe7">Filters on many values</text></g><g><rect x="570" y="48" width="166" height="148" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="582" y="70" font-size="13" font-weight="600" fill="#ecebe7">Index</text><text x="582" y="92" fill="#a9a7a0">A lookup that points to rows</text><rect x="582" y="104" width="56" height="28" rx="3" fill="#5b9bf2" fill-opacity="0.14" stroke="#5b9bf2"