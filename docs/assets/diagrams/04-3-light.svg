<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 386" role="img" aria-label="Lambda keeps two processing paths, and Kappa keeps one" font-size="13"><defs><marker id="lk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Lambda keeps two processing paths, and Kappa keeps one</text><text x="24" y="46" font-size="11.5" fill="#5e5d59">Shaded boxes hold the processing logic</text><text x="24" y="72" font-weight="600" fill="#1f1e1d">Lambda architecture</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M128 148H156"></path><path d="M156 148V112H184" marker-end="url(#lk-arrow)"></path><path d="M156 148V184H184" marker-end="url(#lk-arrow)"></path><path d="M368 112H396V148H424" marker-end="url(#lk-arrow)"></path><path d="M368 184H396V148H424" marker-end="url(#lk-arrow)"></path><path d="M560 148H616" marker-end="url(#lk-arrow)"></path></g><g><rect x="24" y="120" width="104" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="76" y="144" text-anchor="middle" font-weight="600" fill="#1f1e1d">Events</text><text x="76" y="160" text-anchor="middle" font-size="11.5" fill="#5e5d59">Source data</text></g><g><rect x="184" y="84" width="184" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="276" y="108" text-anchor="middle" font-weight="600" fill="#1f1e1d">Batch layer</text><text x="276" y="124" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Accurate, but slower</text></g><g><rect x="184" y="156" width="184" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="276" y="180" text-anchor="middle" font-weight="600" fill="#1f1e1d">Speed layer</text><text x="276" y="196" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Fresh, may be approximate</text></g><g><rect x="424" y="120" width="136" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="492" y="144" text-anchor="middle" font-weight="600" fill="#1f1e1d">Serving layer</text><text x="492" y="160" text-anchor="middle" font-size="11.5" fill="#5e5d59">Merges both results</text></g><g><rect x="616" y="120" width="120" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="676" y="144" text-anchor="middle" font-weight="600" fill="#1f1e1d">Consumers</text><text x="676" y="160" text-anchor="middle" font-size="11.5" fill="#5e5d59">Read results</text></g><text x="184" y="232" font-size="11.5" fill="#5e5d59">The same logic must be maintained in both paths</text><line x1="24" x2="736" y1="250" y2="250" stroke="#e3e1da"></line><text x="24" y="276" font-weight="600" fill="#1f1e1d">Kappa architecture</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M128 316H148" marker-end="url(#lk-arrow)"></path><path d="M252 316H276" marker-end="url(#lk-arrow)"></path><path d="M404 316H424" marker-end="url(#lk-arrow)"></path><path d="M560 316H616" marker-end="url(#lk-arrow)"></path></g><g><rect x="24" y="288" width="104" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="76" y="312" text-anchor="middle" font-weight="600" fill="#1f1e1d">Events</text><text x="76" y="328" text-anchor="middle" font-size="11.5" fill="#5e5d59">Source data</text></g><g><rect x="148" y="288" width="104" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="200" y="312" text-anchor="middle" font-weight="600" fill="#1f1e1d">Event log</text><text x="200" y="328" text-anchor="middle" font-size="11.5" fill="#5e5d59">Replayable</text></g><g><rect x="276" y="288" width="128" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="340" y="312" text-anchor="middle" font-weight="600" fill="#1f1e1d">Stream layer</text><text x="340" y="328" text-anchor="middle" font-size="11.5" fill="#1f1e1d">One code path</text></g><g><rect x="424" y="288" width="136" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="492" y="312" text-anchor="middle" font-weight="600" fill="#1f1e1d">Serving layer</text><text x="492" y="328" text-anchor="middle" font-size="11.5" fill="#5e5d59">Holds the results</text></g><g><rect x="616" y="288" width="120" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="676" y="312" text-anchor="middle" font-weight="600" fill="#1f1e1d">Consumers</text><text x="676" y="328" text-anchor="middle" font-size="11.5" fill="#5e5d59">Read results</text></g><text x="148" y="362" font-size="11.5" fill="#5e5d59">To reprocess history, replay the log through the same code</text></svg>
