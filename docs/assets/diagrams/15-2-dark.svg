<svg xmlns="http://www.w3.org/2000/svg" width="760" height="222" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 222" role="img" aria-label="Three kinds of fact table, by what one row represents" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Three kinds of fact table, by what one row represents</text><g><rect x="24" y="48" width="224" height="150" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#ecebe7">Transaction</text><text x="36" y="88" fill="#a9a7a0">One row per event</text><rect x="36" y="100" width="200" height="26" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><rect x="36" y="132" width="200" height="26" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><rect x="36" y="164" width="200" height="26" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><text x="46" y="117" fill="#ecebe7">Order line 1</text><text x="46" y="149" fill="#ecebe7">Order line 2</text><text x="46" y="181" fill="#ecebe7">Order line 3</text></g><g><rect x="268" y="48" width="224" height="150" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="280" y="70" font-size="13" font-weight="600" fill="#ecebe7">Periodic snapshot</text><text x="280" y="88" fill="#a9a7a0">One row per product per day</text><rect x="280" y="100" width="200" height="26" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><rect x="280" y="132" width="200" height="26" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><rect x="280" y="164" width="200" height="26" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><text x="290" y="117" fill="#ecebe7">Stock on Monday: 40</text><text x="290" y="149" fill="#ecebe7">Stock on Tuesday: 35</text><text x="290" y="181" fill="#ecebe7">Stock on Wednesday: 52</text></g><g><rect x="512" y="48" width="224" height="150" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="524" y="70" font-size="13" font-weight="600" fill="#ecebe7">Accumulating snapshot</text><text x="524" y="88" fill="#a9a7a0">One row per order, updated</text><rect x="524" y="100" width="200" height="58" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><path d="M552 124H624M624 124H696" fill="none" stroke="#76746d" stroke-width="1.25"></path><circle cx="552" cy="124" r="5" fill="#76746d"></circle><circle cx="624" cy="124" r="5" fill="#76746d"></circle><circle cx="696" cy="124" r="5" fill="#76746d"></circle><text x="552" y="146" text-anchor="middle" fill="#ecebe7">Ordered</text><text x="624" y="146" text-anchor="middle" fill="#ecebe7">Shipped</text><text x="696" y="146" text-anchor="middle" fill="#ecebe7">Delivered</text><text x="524" y="182" fill="#a9a7a0">A date is filled in at each stage</text></g></svg>
