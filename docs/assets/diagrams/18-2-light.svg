<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 216" role="img" aria-label="Window functions add a calculated column and keep every row" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Window functions add a calculated column and keep every row</text><g><rect x="24" y="48" width="192" height="122" fill="#eeede8"></rect><rect x="216" y="48" width="520" height="122" fill="#2a6fd6" fill-opacity="0.1"></rect><rect x="24" y="48" width="712" height="122" fill="none" stroke="#a9a79f" stroke-width="1"></rect><g stroke="#e3e1da"><line x1="24" x2="736" y1="92" y2="92"></line><line x1="24" x2="736" y1="118" y2="118"></line><line x1="24" x2="736" y1="144" y2="144"></line><line x1="216" x2="216" y1="48" y2="170"></line></g><text x="32" y="68" font-weight="600" fill="#1f1e1d">month</text><text x="128" y="68" font-weight="600" fill="#1f1e1d">revenue</text><text x="224" y="68" font-weight="600" fill="#1f1e1d">ROW_NUMBER</text><text x="224" y="84" fill="#5e5d59">in month order</text><text x="352" y="68" font-weight="600" fill="#1f1e1d">RANK</text><text x="352" y="84" fill="#5e5d59">highest revenue first</text><text x="480" y="68" font-weight="600" fill="#1f1e1d">LAG</text><text x="480" y="84" fill="#5e5d59">previous month</text><text x="592" y="68" font-weight="600" fill="#1f1e1d">SUM() OVER</text><text x="592" y="84" fill="#5e5d59">running total</text><text x="32" y="110" fill="#1f1e1d">Jan</text><text x="128" y="110" fill="#1f1e1d">10</text><text x="224" y="110" fill="#1f1e1d">1</text><text x="352" y="110" fill="#1f1e1d">3</text><text x="480" y="110" fill="#5e5d59">null</text><text x="592" y="110" fill="#1f1e1d">10</text><text x="32" y="136" fill="#1f1e1d">Feb</text><text x="128" y="136" fill="#1f1e1d">20</text><text x="224" y="136" fill="#1f1e1d">2</text><text x="352" y="136" fill="#1f1e1d">1</text><text x="480" y="136" fill="#1f1e1d">10</text><text x="592" y="136" fill="#1f1e1d">30</text><text x="32" y="162" fill="#1f1e1d">Mar</text><text x="128" y="162" fill="#1f1e1d">20</text><text x="224" y="162" fill="#1f1e1d">3</text><text x="352" y="162" fill="#1f1e1d">1</text><text x="480" y="162" fill="#1f1e1d">20</text><text x="592" y="162" fill="#1f1e1d">50</text></g><text x="24" y="196" fill="#5e5d59">Shaded columns are calculated. February and March tie on revenue, so both get rank 1.</text></svg>
