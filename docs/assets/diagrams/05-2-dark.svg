</line><g><text x="24" y="172" font-weight="600" fill="#ecebe7">Pull</text><text x="24" y="188" font-size="11.5" fill="#a9a7a0">Like checking a mailbox</text><rect x="220" y="160" width="130" height="32" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="490" y="160" width="130" height="32" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M350 176H490" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#ways-arrow)"></path><text x="285" y="180" text-anchor="middle" fill="#ecebe7">Platform</text><text x="555" y="180" text-anchor="middle" fill="#ecebe7">Source</text><text x="420" y="168" text-anchor="middle" font-size="11.5" fill="#a9a7a0">asks for data</text></g><g><text x="24" y="220" font-weight="600" fill="#ecebe7">Push</text><text x="24" y="236" font-size="11.5" fill="#a9a7a0">Like a courier at your door</text><rect x="220" y="208" width="130" height="32" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="490" y="208" width="130" height="32" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><path d="M350 224H490" fill="none" stroke="#76746d" stroke-width="1.25" marker-end="url(#ways-arrow)"></path><text x="285" y="228" text-anchor="middle" fill="#ecebe7">Source</text><text x="555" y="228" text-anchor="middle" fill="#ecebe7">Platform</text><text x="420" y="216" text-anchor="middle" font-size="11.5" fill="#a9a7a0">sends data</text></g><line x1="24" x2="736" y1="252" y2="252" stroke="#3a3936"></line><g><text x="24" y="304" font-weight="600" fill="#ecebe7">Event broker</text><text x="24" y="320" font-size="11.5" fill="#a9a7a0">Such as Kafka, works like</text><text x="24" y="336" font-size="11.5" fill="#a9a7a0">a post office</text><text x="275" y="270" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Producers</text><text x="673" y="270" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Consumers</text><rect x="220" y="278" width="110" height="32" rx="6" fill="none" stro