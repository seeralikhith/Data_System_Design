<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 324" role="img" aria-label="First ask what the system must do, then how well it must do it" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">First ask what the system must do, then how well it must do it</text><text x="24" y="60" font-weight="600" fill="#ecebe7">Functional requirements: what must it do?</text><g><rect x="24" y="72" width="166" height="56" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="206" y="72" width="166" height="56" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="388" y="72" width="166" height="56" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="570" y="72" width="166" height="56" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="36" y="96" font-weight="600" fill="#ecebe7">Sources</text><text x="36" y="114" font-size="11.5" fill="#a9a7a0">Where is data from?</text><text x="218" y="96" font-weight="600" fill="#ecebe7">Users</text><text x="218" y="114" font-size="11.5" fill="#a9a7a0">Who will use it?</text><text x="400" y="96" font-weight="600" fill="#ecebe7">Questions</text><text x="400" y="114" font-size="11.5" fill="#a9a7a0">What must it answer?</text><text x="582" y="96" font-weight="600" fill="#ecebe7">History</text><text x="582" y="114" font-size="11.5" fill="#a9a7a0">How far back?</text></g><text x="24" y="160" font-weight="600" fill="#ecebe7">Non-functional requirements: how well must it do it?</text><g><rect x="24" y="172" width="166" height="56" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="206" y="172" width="166" height="56" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="388" y="172" width="166" height="56" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="570" y="172" width="166" height="56" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="24" y="244" width="166" height="56" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="206" y="244" width="166" height="56" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="388" y="244" width="166" height="56" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><rect x="570" y="244" width="166" height="56" rx="8" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1.25"></rect><text x="36" y="196" font-weight="600" fill="#ecebe7">Freshness</text><text x="36" y="214" font-size="11.5" fill="#ecebe7">How old can data be?</text><text x="218" y="196" font-weight="600" fill="#ecebe7">Query latency</text><text x="218" y="214" font-size="11.5" fill="#ecebe7">How fast must it answer?</text><text x="400" y="196" font-weight="600" fill="#ecebe7">Throughput</text><text x="400" y="214" font-size="11.5" fill="#ecebe7">How much per second?</text><text x="582" y="196" font-weight="600" fill="#ecebe7">Availability</text><text x="582" y="214" font-size="11.5" fill="#ecebe7">How often must it work?</text><text x="36" y="268" font-weight="600" fill="#ecebe7">Durability</text><text x="36" y="286" font-size="11.5" fill="#ecebe7">Can any data be lost?</text><text x="218" y="268" font-weight="600" fill="#ecebe7">Retention</text><text x="218" y="286" font-size="11.5" fill="#ecebe7">How long do we keep it?</text><text x="400" y="268" font-weight="600" fill="#ecebe7">Compliance</text><text x="400" y="286" font-size="11.5" fill="#ecebe7">Which laws apply?</text><text x="582" y="268" font-weight="600" fill="#ecebe7">Budget</text><text x="582" y="286" font-size="11.5" fill="#ecebe7">What can we spend?</text></g></svg>
