<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 220" role="img" aria-label="Two kinds of late-arriving data, and how to handle each" font-size="11.5"><defs><marker id="late-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#76746d"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Two kinds of late-arriving data, and how to handle each</text><g><rect x="24" y="48" width="344" height="148" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="40" y="72" font-size="13" font-weight="600" fill="#ecebe7">Late fact: an old order arrives today</text><rect x="40" y="100" width="56" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="104" y="100" width="56" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="168" y="100" width="56" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="232" y="100" width="56" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="296" y="100" width="56" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="164" y="94" width="192" height="40" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="2" stroke-dasharray="5 4"></rect><text x="68" y="118" text-anchor="middle" fill="#ecebe7">Nov 1</text><text x="132" y="118" text-anchor="middle" fill="#ecebe7">Nov 2</text><text x="196" y="118" text-anchor="middle" fill="#ecebe7">Nov 3</text><text x="260" y="118" text-anchor="middle" fill="#ecebe7">Nov 4</text><text x="324" y="118" text-anchor="middle" fill="#ecebe7">Nov 5</text><text x="260" y="154" text-anchor="middle" font-weight="600" fill="#ecebe7">Last 3 days reprocessed each run</text><text x="40" y="180" fill="#a9a7a0">A Nov 3 order arriving late is still counted</text></g><g><rect x="392" y="48" width="344" height="148" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="408" y="72" font-size="13" font-weight="600" fill="#ecebe7">Early fact: an order before its customer</text><rect x="408" y="100" width="96" height="36" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="512" y="100" width="96" height="36" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="2" stroke-dasharray="5 4"></rect><rect x="616" y="100" width="96" height="36" rx="6" fill="none" stroke="#76746d" stroke-width="1.25"></rect><g fill="none" stroke="#76746d" stroke-width="1.25"><path d="M504 118H512" marker-end="url(#late-arrow)"></path><path d="M608 118H616" marker-end="url(#late-arrow)"></path></g><text x="456" y="122" text-anchor="middle" fill="#ecebe7">Order for C-99</text><text x="560" y="122" text-anchor="middle" font-weight="600" fill="#ecebe7">Placeholder</text><text x="664" y="122" text-anchor="middle" fill="#ecebe7">Filled in later</text><text x="408" y="180" fill="#a9a7a0">The placeholder row is called an inferred member</text></g></svg>
