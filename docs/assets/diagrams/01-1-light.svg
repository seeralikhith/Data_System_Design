<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 260" role="img" aria-label="Data travels from source to dashboard like water from river to tap" font-size="13"><defs><marker id="chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="26" font-size="15" font-weight="600" fill="#1f1e1d">Data travels from source to dashboard like water from river to tap</text><text x="24" y="44" font-size="11.5" fill="#5e5d59">In each box: the stage, then the water network, then the online store</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M128 94H145" marker-end="url(#chain-arrow)"></path><path d="M249 94H266" marker-end="url(#chain-arrow)"></path><path d="M370 94H387" marker-end="url(#chain-arrow)"></path><path d="M491 94H508" marker-end="url(#chain-arrow)"></path><path d="M612 94H629" marker-end="url(#chain-arrow)"></path></g><g><rect x="24" y="56" width="104" height="76" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="76" y="78" text-anchor="middle" font-weight="600" fill="#1f1e1d">Sources</text><text x="76" y="98" text-anchor="middle" font-size="11.5" fill="#5e5d59">Rivers</text><text x="76" y="118" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Orders, clicks</text></g><g><rect x="145" y="56" width="104" height="76" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="197" y="78" text-anchor="middle" font-weight="600" fill="#1f1e1d">Ingestion</text><text x="197" y="98" text-anchor="middle" font-size="11.5" fill="#5e5d59">Pipes</text><text x="197" y="118" text-anchor="middle" font-size="11.5" fill="#1f1e1d">New orders</text></g><g><rect x="266" y="56" width="104" height="76" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="318" y="78" text-anchor="middle" font-weight="600" fill="#1f1e1d">Storage</text><text x="318" y="98" text-anchor="middle" font-size="11.5" fill="#5e5d59">Reservoir</text><text x="318" y="118" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Order tables</text></g><g><rect x="387" y="56" width="104" height="76" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="439" y="78" text-anchor="middle" font-weight="600" fill="#1f1e1d">Processing</text><text x="439" y="98" text-anchor="middle" font-size="11.5" fill="#5e5d59">Treatment plant</text><text x="439" y="118" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Clean, total</text></g><g><rect x="508" y="56" width="104" height="76" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="560" y="78" text-anchor="middle" font-weight="600" fill="#1f1e1d">Serving</text><text x="560" y="98" text-anchor="middle" font-size="11.5" fill="#5e5d59">Water tank</text><text x="560" y="118" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Revenue table</text></g><g><rect x="629" y="56" width="104" height="76" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="681" y="78" text-anchor="middle" font-weight="600" fill="#1f1e1d">Consumption</text><text x="681" y="98" text-anchor="middle" font-size="11.5" fill="#5e5d59">Taps at home</text><text x="681" y="118" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Dashboard</text></g><g><rect x="24" y="152" width="467" height="24" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="257" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Data engineers build this part</text></g><g><rect x="387" y="182" width="225" height="24" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="499" y="198" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Analytics engineers shape this</text></g><g><rect x="508" y="212" width="225" height="24" rx="4" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="620" y="228" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Data analysts use this</text></g></svg>
