<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 324" role="img" aria-label="First ask what the system must do, then how well it must do it" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">First ask what the system must do, then how well it must do it</text><text x="24" y="60" font-weight="600" fill="#1f1e1d">Functional requirements: what must it do?</text><g><rect x="24" y="72" width="166" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="206" y="72" width="166" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="388" y="72" width="166" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><rect x="570" y="72" width="166" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="36" y="96" font-weight="600" fill="#1f1e1d">Sources</text><text x="36" y="114" font-size="11.5" fill="#5e5d59">Where is data from?</text><text x="218" y="96" font-weight="600" fill="#1f1e1d">Users</text><text x="218" y="114" font-size="11.5" fill="#5e5d59">Who will use it?</text><text x="400" y="96" font-weight="600" fill="#1f1e1d">Questions</text><text x="400" y="114" font-size="11.5" fill="#5e5d59">What must it answer?</text><text x="582" y="96" font-weight="600" fill="#1f1e1d">History</text><text x="582" y="114" font-size="11.5" fill="#5e5d59">How far back?</text></g><text x="24" y="160" font-weight="600" fill="#1f1e1d">Non-functional requirements: how well must it do it?</text><g><rect x="24" y="172" width="166" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="206" y="172" width="166" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="388" y="172" width="166" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="570" y="172" width="166" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="24" y="244" width="166" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="206" y="244" width="166" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="388" y="244" width="166" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><rect x="570" y="244" width="166" height="56" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="36" y="196" font-weight="600" fill="#1f1e1d">Freshness</text><text x="36" y="214" font-size="11.5" fill="#1f1e1d">How old can data be?</text><text x="218" y="196" font-weight="600" fill="#1f1e1d">Query latency</text><text x="218" y="214" font-size="11.5" fill="#1f1e1d">How fast must it answer?</text><text x="400" y="196" font-weight="600" fill="#1f1e1d">Throughput</text><text x="400" y="214" font-size="11.5" fill="#1f1e1d">How much per second?</text><text x="582" y="196" font-weight="600" fill="#1f1e1d">Availability</text><text x="582" y="214" font-size="11.5" fill="#1f1e1d">How often must it work?</text><text x="36" y="268" font-weight="600" fill="#1f1e1d">Durability</text><text x="36" y="286" font-size="11.5" fill="#1f1e1d">Can any data be lost?</text><text x="218" y="268" font-weight="600" fill="#1f1e1d">Retention</text><text x="218" y="286" font-size="11.5" fill="#1f1e1d">How long do we keep it?</text><text x="400" y="268" font-weight="600" fill="#1f1e1d">Compliance</text><text x="400" y="286" font-size="11.5" fill="#1f1e1d">Which laws apply?</text><text x="582" y="268" font-weight="600" fill="#1f1e1d">Budget</text><text x="582" y="286" font-size="11.5" fill="#1f1e1d">What can we spend?</text></g></svg>
