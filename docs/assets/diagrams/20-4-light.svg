<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 236" role="img" aria-label="Delivery guarantees describe how many times each event is processed" font-size="11.5"><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Delivery guarantees describe how many times each event is processed</text><text x="220" y="54" fill="#5e5d59">Times each event is processed</text><text x="440" y="54" fill="#5e5d59">Risk</text><g><rect x="24" y="64" width="712" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="24" y="120" width="712" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect><rect x="24" y="176" width="712" height="48" rx="8" fill="none" stroke="#a9a79f" stroke-width="1"></rect></g><g><text x="40" y="92" font-size="13" font-weight="600" fill="#1f1e1d">At-most-once</text><circle cx="236" cy="88" r="8" fill="#2a6fd6"></circle><text x="262" y="92" text-anchor="middle" fill="#5e5d59">or</text><circle cx="288" cy="88" r="8" fill="none" stroke="#a9a79f" stroke-width="1.25" stroke-dasharray="3 3"></circle><text x="310" y="92" fill="#1f1e1d">1 or 0</text><circle cx="446" cy="88" r="4" fill="#d13b3b"></circle><text x="458" y="92" fill="#1f1e1d">Data can be lost</text></g><g><text x="40" y="148" font-size="13" font-weight="600" fill="#1f1e1d">At-least-once</text><circle cx="236" cy="144" r="8" fill="#2a6fd6"></circle><text x="262" y="148" text-anchor="middle" fill="#5e5d59">or</text><circle cx="288" cy="144" r="8" fill="#2a6fd6"></circle><circle cx="308" cy="144" r="8" fill="#2a6fd6"></circle><text x="328" y="148" fill="#1f1e1d">1 or more</text><circle cx="446" cy="144" r="4" fill="#d13b3b"></circle><text x="458" y="148" fill="#1f1e1d">Duplicates, so writes must be idempotent</text></g><g><text x="40" y="204" font-size="13" font-weight="600" fill="#1f1e1d">Exactly-once</text><circle cx="236" cy="200" r="8" fill="#2a6fd6"></circle><text x="256" y="204" fill="#1f1e1d">Exactly 1</text><circle cx="446" cy="200" r="4" fill="#1e9e3a"></circle><text x="458" y="204" fill="#1f1e1d">Needs source, engine and sink to cooperate</text></g></svg>
