<svg xmlns="http://www.w3.org/2000/svg" width="760" height="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 212" role="img" aria-label="A watermark sets how long to wait for late events" font-size="13"><defs><marker id="wm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">A watermark sets how long to wait for late events</text><g><rect x="48" y="52" width="208" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="152" y="74" text-anchor="middle" font-weight="600" fill="#1f1e1d">Time window</text><text x="152" y="92" text-anchor="middle" font-size="11.5" fill="#5e5d59">Events for this period arrive</text></g><g><rect x="260" y="52" width="220" height="52" rx="6" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="2"></rect><text x="370" y="74" text-anchor="middle" font-weight="600" fill="#1f1e1d">Watermark</text><text x="370" y="92" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Still waiting for late events</text></g><g><rect x="484" y="52" width="216" height="52" rx="6" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="592" y="74" text-anchor="middle" font-weight="600" fill="#1f1e1d">Result is final</text><text x="592" y="92" text-anchor="middle" font-size="11.5" fill="#5e5d59">The system stops waiting</text></g><g><path d="M48 136H700" fill="none" stroke="#a9a79f" stroke-width="1.25" marker-end="url(#wm-arrow)"></path><circle cx="152" cy="136" r="6" fill="#1e9e3a"></circle><circle cx="370" cy="136" r="6" fill="#1e9e3a"></circle><circle cx="592" cy="136" r="6" fill="#d13b3b"></circle></g><text x="700" y="124" text-anchor="end" font-size="11.5" fill="#5e5d59">Arrival time</text><text x="152" y="162" text-anchor="middle" font-weight="600" fill="#1f1e1d">On time</text><text x="152" y="180" text-anchor="middle" font-size="11.5" fill="#5e5d59">Counted</text><text x="370" y="162" text-anchor="middle" font-weight="600" fill="#1f1e1d">Late</text><text x="370" y="180" text-anchor="middle" font-size="11.5" fill="#5e5d59">Still counted</text><text x="592" y="162" text-anchor="middle" font-weight="600" fill="#1f1e1d">Too late</text><text x="592" y="180" text-anchor="middle" font-size="11.5" fill="#5e5d59">Not counted in this result</text></svg>
