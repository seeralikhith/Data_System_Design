<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 500" role="img" aria-label="Data flows one way, and three concerns cover every stage" font-size="13"><defs><marker id="system-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9a79f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">Data flows one way, and three concerns cover every stage</text><g fill="none" stroke="#a9a79f" stroke-width="1.25"><path d="M272 108V132" marker-end="url(#system-arrow)"></path><path d="M100 188V244" marker-end="url(#system-arrow)"></path><path d="M160 272H212" marker-end="url(#system-arrow)"></path><path d="M332 272H384" marker-end="url(#system-arrow)"></path><path d="M444 300V340" marker-end="url(#system-arrow)"></path><path d="M272 396V420" marker-end="url(#system-arrow)"></path></g><g fill="none" stroke="#2a6fd6" stroke-width="1.25"><path d="M536 80V448"></path><path d="M520 80H536"></path><path d="M520 160H536"></path><path d="M520 264H536"></path><path d="M520 368H536"></path><path d="M520 448H536"></path><path d="M536 117H552"></path><path d="M536 264H552"></path><path d="M536 411H552"></path></g><g><rect x="24" y="52" width="496" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="76" font-weight="600" fill="#1f1e1d">Sources</text><text x="40" y="92" font-size="11.5" fill="#5e5d59">Where data is created: databases, SaaS APIs, files and event streams</text></g><g><rect x="24" y="132" width="496" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="156" font-weight="600" fill="#1f1e1d">Ingestion</text><text x="40" y="172" font-size="11.5" fill="#5e5d59">Copies data into the platform using ETL, ELT, CDC or event brokers</text></g><g><rect x="24" y="212" width="496" height="104" rx="8" fill="#eeede8" stroke="#a9a79f" stroke-width="1.25"></rect><text x="272" y="234" text-anchor="middle" font-weight="600" fill="#1f1e1d">Storage, with processing between layers</text></g><g><rect x="40" y="244" width="120" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="100" y="268" text-anchor="middle" font-weight="600" fill="#1f1e1d">Bronze</text><text x="100" y="284" text-anchor="middle" font-size="11.5" fill="#5e5d59">Raw data</text></g><g><rect x="212" y="244" width="120" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="272" y="268" text-anchor="middle" font-weight="600" fill="#1f1e1d">Silver</text><text x="272" y="284" text-anchor="middle" font-size="11.5" fill="#5e5d59">Cleaned data</text></g><g><rect x="384" y="244" width="120" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="444" y="268" text-anchor="middle" font-weight="600" fill="#1f1e1d">Gold</text><text x="444" y="284" text-anchor="middle" font-size="11.5" fill="#5e5d59">Report-ready</text></g><text x="186" y="264" text-anchor="middle" font-size="11.5" fill="#5e5d59">clean</text><text x="358" y="264" text-anchor="middle" font-size="11.5" fill="#5e5d59">model</text><g><rect x="24" y="340" width="496" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="364" font-weight="600" fill="#1f1e1d">Serving</text><text x="40" y="380" font-size="11.5" fill="#5e5d59">Shapes data for each use through tables, a semantic layer or APIs</text></g><g><rect x="24" y="420" width="496" height="56" rx="8" fill="none" stroke="#a9a79f" stroke-width="1.25"></rect><text x="40" y="444" font-weight="600" fill="#1f1e1d">Consumption</text><text x="40" y="460" font-size="11.5" fill="#5e5d59">People and applications use it: dashboards, SQL, apps and ML</text></g><g><rect x="552" y="52" width="184" height="130" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="568" y="88" font-weight="600" fill="#1f1e1d">Orchestration</text><text x="568" y="108" font-size="11.5" fill="#1f1e1d">Runs each step in the</text><text x="568" y="124" font-size="11.5" fill="#1f1e1d">right order and time,</text><text x="568" y="140" font-size="11.5" fill="#1f1e1d">and reacts to failures</text></g><g><rect x="552" y="199" width="184" height="130" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="568" y="235" font-weight="600" fill="#1f1e1d">Governance</text><text x="568" y="255" font-size="11.5" fill="#1f1e1d">Controls who can see</text><text x="568" y="271" font-size="11.5" fill="#1f1e1d">what, and records where</text><text x="568" y="287" font-size="11.5" fill="#1f1e1d">data came from</text></g><g><rect x="552" y="346" width="184" height="130" rx="8" fill="#2a6fd6" fill-opacity="0.12" stroke="#2a6fd6" stroke-width="1.25"></rect><text x="568" y="382" font-weight="600" fill="#1f1e1d">Observability</text><text x="568" y="402" font-size="11.5" fill="#1f1e1d">Checks that data is on</text><text x="568" y="418" font-size="11.5" fill="#1f1e1d">time, complete and</text><text x="568" y="434" font-size="11.5" fill="#1f1e1d">correct</text></g></svg>
