<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 292" role="img" aria-label="A lakehouse adds a table layer on top of cheap lake storage" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">A lakehouse adds a table layer on top of cheap lake storage</text><g><rect x="24" y="48" width="224" height="220" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="40" y="84" width="192" height="44" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="40" y="136" width="192" height="44" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="40" y="188" width="192" height="44" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><text x="136" y="72" text-anchor="middle" font-weight="600" fill="#ecebe7">Data warehouse</text><text x="136" y="110" text-anchor="middle" fill="#ecebe7">SQL and BI tools</text><text x="136" y="162" text-anchor="middle" fill="#ecebe7">Built-in tables</text><text x="136" y="214" text-anchor="middle" fill="#ecebe7">Managed storage</text><text x="136" y="254" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Fast SQL, less flexible</text></g><g><rect x="268" y="48" width="224" height="220" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="284" y="84" width="192" height="44" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="284" y="136" width="192" height="44" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="284" y="188" width="192" height="44" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><text x="380" y="72" text-anchor="middle" font-weight="600" fill="#ecebe7">Data lake</text><text x="380" y="110" text-anchor="middle" fill="#ecebe7">Spark and ML tools</text><text x="380" y="162" text-anchor="middle" fill="#ecebe7">Plain files</text><text x="380" y="214" text-anchor="middle" fill="#ecebe7">Object storage</text><text x="380" y="254" text-anchor="middle" font-size="11.5" fill="#a9a7a0">Flexible, can get messy</text></g><g><rect x="512" y="48" width="224" height="220" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="528" y="84" width="192" height="44" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="528" y="136" width="192" height="44" rx="6" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="2"></rect><rect x="528" y="188" width="192" height="44" rx="6" fill="none" stroke="#76746d" stroke-width="1"></rect><text x="624" y="72" text-anchor="middle" font-weight="600" fill="#ecebe7">Lakehouse</text><text x="624" y="110" text-anchor="middle" fill="#ecebe7">SQL, BI, Spark and ML</text><text x="624" y="162" text-anchor="middle" font-weight="600" fill="#ecebe7">Open table format</text><text x="624" y="214" text-anchor="middle" fill="#ecebe7">Object storage</text><text x="624" y="254" text-anchor="middle" font-size="11.5" fill="#a9a7a0">One copy of data for all uses</text></g></svg>
