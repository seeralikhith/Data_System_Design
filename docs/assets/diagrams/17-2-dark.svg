<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 320" role="img" aria-label="Five safeguards that make ingestion reliable" font-size="11.5"><defs><marker id="ing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#76746d"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#ecebe7">Five safeguards that make ingestion reliable</text><g><rect x="24" y="48" width="224" height="124" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="36" y="70" font-size="13" font-weight="600" fill="#ecebe7">Applying CDC events</text><rect x="36" y="80" width="200" height="20" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><rect x="36" y="104" width="200" height="20" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><rect x="36" y="128" width="200" height="20" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><text x="44" y="94" fill="#ecebe7">LSN 101: insert order 17</text><text x="44" y="118" fill="#ecebe7">LSN 102: update order 17</text><text x="44" y="142" fill="#ecebe7">LSN 103: delete order 17</text><text x="36" y="164" fill="#a9a7a0">Applied in sequence order</text></g><g><rect x="268" y="48" width="224" height="124" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="280" y="70" font-size="13" font-weight="600" fill="#ecebe7">Checkpoint</text><rect x="280" y="106" width="200" height="14" rx="3" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="280" y="106" width="120" height="14" rx="3" fill="#5b9bf2" fill-opacity="0.4"></rect><path d="M400 92V128" fill="none" stroke="#5b9bf2" stroke-width="2"></path><text x="404" y="98" fill="#ecebe7">Saved progress</text><text x="380" y="150" text-anchor="middle" fill="#a9a7a0">After a failure, restart from here</text></g><g><rect x="512" y="48" width="224" height="124" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="524" y="70" font-size="13" font-weight="600" fill="#ecebe7">Pagination</text><rect x="524" y="96" width="56" height="40" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="588" y="96" width="56" height="40" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><rect x="652" y="96" width="56" height="40" rx="4" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="552" y="120" text-anchor="middle" fill="#ecebe7">Page 1</text><text x="616" y="120" text-anchor="middle" fill="#ecebe7">Page 2</text><text x="680" y="120" text-anchor="middle" fill="#ecebe7">Page 3</text><text x="624" y="158" text-anchor="middle" fill="#a9a7a0">A cursor marks the next page</text></g><g><rect x="24" y="184" width="344" height="112" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="36" y="206" font-size="13" font-weight="600" fill="#ecebe7">Rate limits</text><rect x="40" y="228" width="96" height="28" rx="4" fill="none" stroke="#76746d" stroke-width="1"></rect><rect x="160" y="228" width="80" height="28" rx="4" fill="#f06a6a" fill-opacity="0.12" stroke="#f06a6a" stroke-width="1.25"></rect><rect x="264" y="228" width="96" height="28" rx="4" fill="#5b9bf2" fill-opacity="0.12" stroke="#5b9bf2" stroke-width="1"></rect><g fill="none" stroke="#76746d" stroke-width="1.25"><path d="M136 242H160" marker-end="url(#ing-arrow)"></path><path d="M240 242H264" marker-end="url(#ing-arrow)"></path></g><text x="88" y="246" text-anchor="middle" fill="#ecebe7">Too many calls</text><text x="200" y="246" text-anchor="middle" font-weight="600" fill="#ecebe7">HTTP 429</text><text x="312" y="246" text-anchor="middle" fill="#ecebe7">Wait, retry</text><text x="36" y="280" fill="#a9a7a0">The API caps how many requests you can make</text></g><g><rect x="392" y="184" width="344" height="112" rx="8" fill="none" stroke="#76746d" stroke-width="1.25"></rect><text x="404" y="206" font-size="13" font-weight="600" fill="#ecebe7">Ingestion metadata</text><rect x="408" y="228" width="64" height="26" fill="#2b2a27" stroke="#76746d" stroke-width="1"></rect><rect x="472" y="228" width="88" height="26" fill="#5b9bf2" fill-opacity="0.14" stroke="#76746d" stroke-width="1"></rect><rect x="560" y="228" width="88" height="26" fill="#5b9bf2" fill-opacity="0.14" stroke="#76746d" stroke-width="1"></rect><rect x="648" y="228" width="72" height="26" fill="#5b9bf2" fill-opacity="0.14" stroke="#76746d" stroke-width="1"></rect><text x="416" y="245" fill="#ecebe7">order_id</text><text x="480" y="245" fill="#ecebe7">_ingested_at</text><text x="568" y="245" fill="#ecebe7">_source_file</text><text x="656" y="245" fill="#ecebe7">_run_id</text><text x="404" y="280" fill="#a9a7a0">Shaded columns are added to every Bronze row</text></g></svg>
